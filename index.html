<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دوستانه</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#f4f6fb;
    color:#222;
    min-height:100vh;
}

button,input{
    font-family:inherit;
}

.hidden{
    display:none !important;
}

/* AUTH */

#authPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.authBox{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:24px;
    padding:28px 22px;
    box-shadow:0 10px 40px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    font-size:34px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:28px;
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:20px;
}

.tabs button{
    flex:1;
    border:0;
    padding:12px;
    border-radius:12px;
    background:#eee;
    cursor:pointer;
}

.tabs button.active{
    background:#222;
    color:white;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
}

.field input{
    width:100%;
    border:1px solid #ddd;
    border-radius:13px;
    padding:14px;
    outline:none;
    font-size:15px;
}

.field input:focus{
    border-color:#555;
}

.mainBtn{
    width:100%;
    border:0;
    border-radius:14px;
    padding:14px;
    background:#222;
    color:white;
    font-size:16px;
    cursor:pointer;
    margin-top:5px;
}

.secondaryBtn{
    width:100%;
    border:0;
    background:none;
    color:#555;
    padding:13px;
    cursor:pointer;
}

.message{
    margin-top:15px;
    padding:11px;
    border-radius:10px;
    background:#f1f1f1;
    font-size:13px;
    line-height:1.7;
}

/* APP */

#appPage{
    min-height:100vh;
}

.header{
    background:white;
    padding:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #eee;
    position:sticky;
    top:0;
    z-index:10;
}

.headerLogo{
    font-size:22px;
    font-weight:bold;
}

.profileBtn{
    border:0;
    background:#eee;
    border-radius:50%;
    width:42px;
    height:42px;
    cursor:pointer;
    font-size:18px;
}

.container{
    max-width:700px;
    margin:auto;
    padding:18px;
}

.search{
    width:100%;
    border:0;
    background:white;
    border-radius:15px;
    padding:15px;
    outline:none;
    margin-bottom:18px;
    box-shadow:0 3px 15px rgba(0,0,0,.04);
}

.sectionTitle{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.userList{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.user{
    background:white;
    padding:14px;
    border-radius:17px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    box-shadow:0 3px 15px rgba(0,0,0,.04);
}

.user:active{
    transform:scale(.99);
}

.avatar{
    width:48px;
    height:48px;
    background:#222;
    color:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    flex-shrink:0;
}

.userInfo{
    flex:1;
    min-width:0;
}

.userName{
    font-weight:bold;
    margin-bottom:5px;
}

.userEmail{
    color:#888;
    font-size:12px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* CHAT */

#chatPage{
    min-height:100vh;
    background:#f4f6fb;
}

.chatHeader{
    background:white;
    padding:13px 15px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid #eee;
    position:sticky;
    top:0;
    z-index:10;
}

.backBtn{
    border:0;
    background:#eee;
    width:40px;
    height:40px;
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
}

.chatUserName{
    font-weight:bold;
}

.messages{
    max-width:700px;
    margin:auto;
    padding:20px 15px 90px;
    display:flex;
    flex-direction:column;
    gap:10px;
    min-height:calc(100vh - 70px);
}

.msg{
    max-width:78%;
    padding:11px 14px;
    border-radius:17px;
    line-height:1.7;
    word-break:break-word;
    white-space:pre-wrap;
}

.msg.me{
    align-self:flex-start;
    background:#222;
    color:white;
    border-bottom-left-radius:5px;
}

.msg.other{
    align-self:flex-end;
    background:white;
    border-bottom-right-radius:5px;
    box-shadow:0 2px 8px rgba(0,0,0,.03);
}

.emptyChat{
    align-self:center;
    margin-top:35vh;
    color:#888;
    font-size:14px;
}

.chatInputBox{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:white;
    padding:10px;
    border-top:1px solid #eee;
    z-index:20;
}

.chatInputInner{
    max-width:700px;
    margin:auto;
    display:flex;
    gap:8px;
}

.chatInput{
    flex:1;
    border:1px solid #ddd;
    border-radius:14px;
    padding:12px;
    outline:none;
    min-width:0;
}

.chatInput:focus{
    border-color:#555;
}

.sendBtn{
    width:52px;
    border:0;
    border-radius:14px;
    background:#222;
    color:white;
    cursor:pointer;
    flex-shrink:0;
}

.sendBtn:disabled{
    opacity:.5;
}

/* PROFILE */

.profileCard{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-top:20px;
}

.profileAvatar{
    width:80px;
    height:80px;
    background:#222;
    color:white;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    margin:0 auto 15px;
}

.profileName{
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

.profileEmail{
    text-align:center;
    color:#888;
    margin-top:7px;
}

.logoutBtn{
    margin-top:20px;
    width:100%;
    padding:13px;
    border:0;
    border-radius:13px;
    background:#eee;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- AUTH -->

<div id="authPage">

    <div class="authBox">

        <div class="logo">دوستانه</div>
        <div class="subtitle">با دوستانت در ارتباط باش</div>

        <div class="tabs">
            <button id="loginTab" class="active" onclick="showLogin()">ورود</button>
            <button id="signupTab" onclick="showSignup()">ثبت نام</button>
        </div>

        <!-- LOGIN -->

        <div id="loginForm">

            <div class="field">
                <label>ایمیل / جیمیل</label>
                <input id="loginEmail" type="email" placeholder="example@gmail.com">
            </div>

            <div class="field">
                <label>رمز عبور</label>
                <input id="loginPassword" type="password" placeholder="رمز عبور">
            </div>

            <button class="mainBtn" onclick="login()">ورود</button>

            <button class="secondaryBtn" onclick="showForgot()">
                رمز عبورم را فراموش کردم
            </button>

        </div>

        <!-- SIGNUP -->

        <div id="signupForm" class="hidden">

            <div class="field">
                <label>نام شما</label>
                <input id="signupName" type="text" placeholder="مثلاً صابر">
            </div>

            <div class="field">
                <label>ایمیل / جیمیل</label>
                <input id="signupEmail" type="email" placeholder="example@gmail.com">
            </div>

            <div class="field">
                <label>رمز عبور</label>
                <input id="signupPassword" type="password" placeholder="حداقل 6 کاراکتر">
            </div>

            <button class="mainBtn" onclick="signup()">ثبت نام</button>

        </div>

        <!-- FORGOT -->

        <div id="forgotForm" class="hidden">

            <div class="field">
                <label>ایمیل / جیمیل</label>
                <input id="forgotEmail" type="email" placeholder="example@gmail.com">
            </div>

            <button class="mainBtn" onclick="forgotPassword()">
                ارسال لینک بازیابی
            </button>

            <button class="secondaryBtn" onclick="showLogin()">
                برگشت به ورود
            </button>

        </div>

        <!-- RESET -->

        <div id="resetForm" class="hidden">

            <div class="field">
                <label>رمز جدید</label>
                <input id="newPassword" type="password" placeholder="رمز جدید">
            </div>

            <div class="field">
                <label>تکرار رمز جدید</label>
                <input id="newPassword2" type="password" placeholder="تکرار رمز">
            </div>

            <button class="mainBtn" onclick="updatePassword()">
                ذخیره رمز جدید
            </button>

        </div>

        <div id="authMessage" class="message hidden"></div>

    </div>

</div>


<!-- APP -->

<div id="appPage" class="hidden">

    <div class="header">

        <div class="headerLogo">دوستانه</div>

        <button class="profileBtn" onclick="showProfile()">
            👤
        </button>

    </div>

    <div class="container">

        <input
            id="searchInput"
            class="search"
            placeholder="جستجوی کاربران..."
            oninput="searchUsers()"
        >

        <div class="sectionTitle">
            کاربران دوستانه
        </div>

        <div id="userList" class="userList">
            در حال بارگذاری...
        </div>

    </div>

</div>


<!-- PROFILE -->

<div id="profilePage" class="hidden">

    <div class="header">

        <button class="backBtn" onclick="showHome()">→</button>

        <div class="headerLogo">پروفایل</div>

        <div></div>

    </div>

    <div class="container">

        <div class="profileCard">

            <div id="profileAvatar" class="profileAvatar">
                👤
            </div>

            <div id="profileName" class="profileName">
                -
            </div>

            <div id="profileEmail" class="profileEmail">
                -
            </div>

            <button class="logoutBtn" onclick="logout()">
                خروج از حساب
            </button>

        </div>

    </div>

</div>


<!-- CHAT -->

<div id="chatPage" class="hidden">

    <div class="chatHeader">

        <button class="backBtn" onclick="showHome()">
            →
        </button>

        <div id="chatAvatar" class="avatar">
            👤
        </div>

        <div id="chatUserName" class="chatUserName">
            کاربر
        </div>

    </div>

    <div id="messages" class="messages"></div>

    <div class="chatInputBox">

        <div class="chatInputInner">

            <input
                id="chatInput"
                class="chatInput"
                placeholder="پیامت رو بنویس..."
                onkeydown="handleEnter(event)"
            >

            <button
                id="sendBtn"
                class="sendBtn"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://uobviepglysngosuomph.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ki1URRpDpSc-E5h5HQiq3w_2_-LHIHa";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let currentChatUser = null;
let allUsers = [];
let messagesChannel = null;


/* =========================
   HELPERS
========================= */

function $(id){
    return document.getElementById(id);
}

function showMessage(text){

    $("authMessage").textContent = text;

    $("authMessage")
        .classList
        .remove("hidden");
}

function hideMessage(){

    $("authMessage")
        .classList
        .add("hidden");
}

function firstLetter(name){

    if(!name) return "؟";

    return name.trim().charAt(0);
}


/* =========================
   AUTH TABS
========================= */

function hideAllForms(){

    $("loginForm").classList.add("hidden");
    $("signupForm").classList.add("hidden");
    $("forgotForm").classList.add("hidden");
    $("resetForm").classList.add("hidden");
}

function showLogin(){

    hideAllForms();

    $("loginForm")
        .classList
        .remove("hidden");

    $("loginTab")
        .classList
        .add("active");

    $("signupTab")
        .classList
        .remove("active");

    hideMessage();
}

function showSignup(){

    hideAllForms();

    $("signupForm")
        .classList
        .remove("hidden");

    $("loginTab")
        .classList
        .remove("active");

    $("signupTab")
        .classList
        .add("active");

    hideMessage();
}

function showForgot(){

    hideAllForms();

    $("forgotForm")
        .classList
        .remove("hidden");

    $("loginTab")
        .classList
        .remove("active");

    $("signupTab")
        .classList
        .remove("active");

    hideMessage();
}


/* =========================
   SIGNUP
========================= */

async function signup(){

    const name =
        $("signupName")
        .value
        .trim();

    const email =
        $("signupEmail")
        .value
        .trim();

    const password =
        $("signupPassword")
        .value;

    if(!name || !email || !password){

        showMessage(
            "لطفاً همه فیلدها را پر کن."
        );

        return;
    }

    if(password.length < 6){

        showMessage(
            "رمز عبور باید حداقل ۶ کاراکتر باشد."
        );

        return;
    }

    showMessage(
        "در حال ثبت نام..."
    );

    const {data,error} =
        await supabaseClient.auth.signUp({

            email:email,

            password:password,

            options:{
                data:{
                    display_name:name
                }
            }

        });

    if(error){

        showMessage(error.message);

        return;
    }

    if(data.user){

        if(data.session){

            await createProfile(
                data.user,
                name
            );

            showMessage(
                "ثبت نام انجام شد."
            );

            setTimeout(()=>{
                loadApp();
            },700);

        }else{

            showMessage(
                "ثبت نام انجام شد. اگر تأیید ایمیل فعال باشد، ایمیلت را باز کن و روی لینک تأیید بزن، سپس وارد شو."
            );

            showLogin();
        }
    }
}


/* =========================
   CREATE PROFILE
========================= */

async function createProfile(user,name){

    const {error} =
        await supabaseClient
        .from("profiles")
        .upsert({

            id:user.id,

            display_name:
                name ||
                user.user_metadata?.display_name ||
                "کاربر",

            email:
                user.email || ""

        });

    if(error){

        console.log(
            "Profile error:",
            error
        );
    }
}


/* =========================
   LOGIN
========================= */

async function login(){

    const email =
        $("loginEmail")
        .value
        .
