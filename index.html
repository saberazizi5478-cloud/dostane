<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>دوستانه</title>

  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <link rel="manifest" href="./manifest.json" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* AUTH */

    #authPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
    }

    .auth-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.18);
    }

    .logo {
      width: 70px;
      height: 70px;
      border-radius: 22px;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 32px;
    }

    .auth-title {
      text-align: center;
      margin: 0 0 8px;
      font-size: 26px;
    }

    .auth-subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      color: #475467;
    }

    .field input {
      width: 100%;
      height: 48px;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      padding: 0 14px;
      outline: none;
      font-size: 15px;
      direction: rtl;
    }

    .field input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }

    .primary-btn {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      margin-top: 5px;
    }

    .primary-btn:disabled {
      opacity: .6;
    }

    .switch-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: #2563eb;
      margin-top: 15px;
      font-size: 14px;
    }

    .auth-message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #f2f4f7;
      color: #475467;
      font-size: 13px;
      line-height: 1.8;
      display: none;
    }

    .auth-message.show {
      display: block;
    }

    /* APP */

    #appPage {
      min-height: 100vh;
    }

    .app-header {
      height: 70px;
      background: white;
      border-bottom: 1px solid #eaecf0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      font-size: 22px;
      font-weight: bold;
      color: #2563eb;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 12px;
      background: #f2f4f7;
      font-size: 20px;
    }

    .app-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 22px 16px;
    }

    .welcome {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .welcome h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .welcome p {
      margin: 0;
      opacity: .9;
      font-size: 14px;
    }

    .search-box {
      position: relative;
      margin-bottom: 18px;
    }

    .search-box input {
      width: 100%;
      height: 50px;
      border: 1px solid #d0d5dd;
      border-radius: 14px;
      background: white;
      padding: 0 16px;
      outline: none;
      font-size: 14px;
    }

    .section-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .users-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .user-card {
      width: 100%;
      border: 1px solid #eaecf0;
      background: white;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: right;
    }

    .user-card:hover {
      background: #f9fafb;
    }

    .avatar {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 20px;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-info {
      min-width: 0;
      flex: 1;
    }

    .user-name {
      font-size: 15px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-date {
      color: #98a2b3;
      font-size: 11px;
      margin-top: 5px;
    }

    .empty-state {
      background: white;
      border-radius: 16px;
      padding: 30px 15px;
      text-align: center;
      color: #667085;
      font-size: 14px;
      line-height: 1.9;
    }

    /* PROFILE */

    .profile-page {
      background: white;
      border-radius: 20px;
      padding: 25px;
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      overflow: hidden;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-name {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .profile-email {
      text-align: center;
      color: #98a2b3;
      font-size: 12px;
      direction: ltr;
      margin-bottom: 25px;
    }

    /* CHAT */

    .chat-page {
      position: fixed;
      inset: 0;
      background: #f5f7fb;
      z-index: 50;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      height: 65px;
      background: white;
      border-bottom: 1px solid #eaecf0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
    }

    .chat-user-name {
      font-weight: bold;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 78%;
      padding: 10px 13px;
      border-radius: 15px;
      line-height: 1.7;
      font-size: 14px;
      word-break: break-word;
    }

    .message.mine {
      align-self: flex-start;
      background: #2563eb;
      color: white;
      border-bottom-left-radius: 5px;
    }

    .message.theirs {
      align-self: flex-end;
      background: white;
      color: #172033;
      border: 1px solid #eaecf0;
      border-bottom-right-radius: 5px;
    }

    .chat-input-area {
      background: white;
      border-top: 1px solid #eaecf0;
      padding: 10px;
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      height: 45px;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      padding: 0 12px;
      outline: none;
    }

    .send-btn {
      width: 48px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 18px;
    }

    /* LOADING */

    #loadingPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
    }

    .loading-box {
      text-align: center;
      color: #667085;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid #dbeafe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (min-width: 700px) {
      .app-container {
        padding-top: 30px;
      }
    }
  </style>
</head>

<body>

  <!-- LOADING -->

  <div id="loadingPage">
    <div class="loading-box">
      <div class="spinner"></div>
      <div>در حال بارگذاری...</div>
    </div>
  </div>


  <!-- AUTH -->

  <div id="authPage" class="hidden">

    <div class="auth-box">

      <div class="logo">👥</div>

      <h1 class="auth-title">دوستانه</h1>

      <div class="auth-subtitle">
        با دوستانت در ارتباط باش
      </div>

      <!-- LOGIN -->

      <div id="loginForm">

        <div class="field">
          <label>ایمیل</label>
          <input
            id="loginEmail"
            type="email"
            autocomplete="email"
            placeholder="ایمیل خود را وارد کنید"
          />
        </div>

        <div class="field">
          <label>رمز عبور</label>
          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            placeholder="رمز عبور"
          />
        </div>

        <button
          id="loginBtn"
          class="primary-btn"
        >
          ورود
        </button>

        <button
          id="showSignupBtn"
          class="switch-btn"
        >
          حساب ندارم؛ ثبت‌نام می‌کنم
        </button>

      </div>


      <!-- SIGNUP -->

      <div id="signupForm" class="hidden">

        <div class="field">
          <label>نام نمایشی</label>
          <input
            id="signupName"
            type="text"
            placeholder="مثلاً صابر"
          />
        </div>

        <div class="field">
          <label>ایمیل</label>
          <input
            id="signupEmail"
            type="email"
            autocomplete="email"
            placeholder="ایمیل"
          />
        </div>

        <div class="field">
          <label>رمز عبور</label>
          <input
            id="signupPassword"
            type="password"
            autocomplete="new-password"
            placeholder="حداقل ۶ کاراکتر"
          />
        </div>

        <button
          id="signupBtn"
          class="primary-btn"
        >
          ثبت‌نام
        </button>

        <button
          id="showLoginBtn"
          class="switch-btn"
        >
          قبلاً ثبت‌نام کرده‌ام
        </button>

      </div>

      <div
        id="authMessage"
        class="auth-message"
      ></div>

    </div>

  </div>


  <!-- APP -->

  <div id="appPage" class="hidden">

    <header class="app-header">

      <div class="brand">
        دوستانه
      </div>

      <div class="header-actions">

        <button
          id="profileBtn"
          class="icon-btn"
          title="پروفایل"
        >
          👤
        </button>

        <button
          id="logoutBtn"
          class="icon-btn"
          title="خروج"
        >
          ⎋
        </button>

      </div>

    </header>


    <main class="app-container">

      <!-- HOME -->

      <section id="homePage">

        <div class="welcome">

          <h2 id="welcomeText">
            سلام 👋
          </h2>

          <p>
            دوستانت رو پیدا کن و گفتگو رو شروع کن
          </p>

        </div>


        <div class="search-box">

          <input
            id="searchInput"
            type="search"
            placeholder="جستجوی کاربران..."
            autocomplete="off"
          />

        </div>


        <div class="section-title">
          کاربران
        </div>


        <div
          id="usersList"
          class="users-list"
        >

          <div class="empty-state">
            در حال بارگذاری کاربران...
          </div>

        </div>

      </section>


      <!-- PROFILE -->

      <section
        id="profilePage"
        class="hidden"
      >

        <div class="profile-page">

          <div
            id="profileAvatar"
            class="profile-avatar"
          >
            👤
          </div>

          <div
            id="profileName"
            class="profile-name"
          >
            -
          </div>

          <div
            id="profileEmail"
            class="profile-email"
          >
            -
          </div>

          <div class="field">

            <label>
              نام نمایشی
            </label>

            <input
              id="editDisplayName"
              type="text"
              placeholder="نام نمایشی"
            />

          </div>

          <button
            id="saveProfileBtn"
            class="primary-btn"
          >
            ذخیره تغییرات
          </button>

          <button
            id="backHomeBtn"
            class="switch-btn"
          >
            بازگشت
          </button>

        </div>

      </section>

    </main>

  </div>


  <!-- CHAT -->

  <div
    id="chatPage"
    class="chat-page hidden"
  >

    <div class="chat-header">

      <button
        id="closeChatBtn"
        class="icon-btn"
      >
        → 
      </button>

      <div
        id="chatAvatar"
        class="avatar"
      >
        👤
      </div>

      <div
        id="chatUserName"
        class="chat-user-name"
      >
        گفتگو
      </div>

    </div>


    <div
      id="chatMessages"
      class="chat-messages"
    >
    </div>


    <div class="chat-input-area">

      <input
        id="chatInput"
        class="chat-input"
        type="text"
        placeholder="پیامت رو بنویس..."
        autocomplete="off"
      />

      <button
        id="sendBtn"
        class="send-btn"
      >
        ➤
      </button>

    </div>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://uobviepglysngosuomph.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ki1URRpDpSc-E5h5HQiq3w_2_-LHIHa";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const $ = id =>
      document.getElementById(id);


    let currentUser = null;
    let currentProfile = null;

    let allUsers = [];

    let currentChatUser = null;

    let realtimeChannel = null;


    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function showAuthMessage(message) {

      const box = $("authMessage");

      box.textContent = message;

      box.classList.add("show");

    }


    function hideAuthMessage() {

      $("authMessage")
        .classList.remove("show");

    }


    function showAuth() {

      $("loadingPage")
        .classList.add("hidden");

      $("appPage")
        .classList.add("hidden");

      $("authPage")
        .classList.remove("hidden");

    }


    function showApp() {

      $("loadingPage")
        .classList.add("hidden");

      $("authPage")
        .classList.add("hidden");

      $("appPage")
        .classList.remove("hidden");

    }


    async function createProfile(
      user,
      displayName
    ) {

      const name =
        String(displayName || "")
          .trim();

      const {
        error
      } =
        await supabaseClient
          .from("profiles")
          .upsert(
            {
              id: user.id,
              display_name: name
            },
            {
              onConflict: "id"
            }
          );

      if (error) {

        console.error(
          "PROFILE ERROR:",
          error
        );

      }

    }


    async function loadApp(user) {

      currentUser = user;


      const {
        data: profile,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,display_name,avatar_url,created_at,updated_at,approved"
          )
          .eq(
            "id",
            user.id
          )
          .maybeSingle();


      if (error) {

        console.error(
          "PROFILE LOAD ERROR:",
          error
        );

        showAuth();

        showAuthMessage(
          "خطا در دریافت اطلاعات حساب."
        );

        return;

      }


      if (!profile) {

        await createProfile(
          user,
          user.user_metadata?.display_name ||
          ""
        );


        const result =
          await supabaseClient
            .from("profiles")
            .select(
              "id,display_name,avatar_url,created_at,updated_at,approved"
            )
            .eq(
              "id",
              user.id
            )
            .maybeSingle();


        if (result.error) {

          console.error(
            "PROFILE CREATE ERROR:",
            result.error
          );

          showAuth();

          showAuthMessage(
            "خطا در ساخت پروفایل."
          );

          return;

        }


        currentProfile =
          result.data;

      } else {

        currentProfile =
          profile;

      }


      /*
        کاربر ثبت‌نام کرده ولی هنوز مدیر تأیید نکرده
      */

      if (
        !currentProfile ||
        currentProfile.approved !== true
      ) {

        await supabaseClient.auth.signOut();

        showAuth();

        showAuthMessage(
          "ثبت‌نام شما انجام شده است. برای ورود به دوستانه باید توسط مدیر تأیید شوید."
        );

        return;

      }


      showApp();


      $("welcomeText").textContent =
        "سلام " +
        (
          currentProfile.display_name ||
          "دوست من"
        ) +
        " 👋";


      await loadUsers();

    }


    async function loadUsers() {

      /*
        عمداً approved را از SELECT نخوانده‌ایم.
        RLS دیتابیس خودش کاربران مجاز را نمایش می‌دهد.
      */

      const {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,display_name,avatar_url,created_at"
          )
          .neq(
            "id",
            currentUser.id
          )
          .order(
            "display_name",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          "USERS LOAD ERROR:",
          error
        );

        $("usersList").innerHTML =
          `
          <div class="empty-state">
            <b>خطا در دریافت کاربران</b>
            <br><br>
            لطفاً صفحه را دوباره باز کنید.
          </div>
          `;

        return;

      }


      allUsers =
        data || [];


      renderUsers(
        allUsers
      );

    }


    function renderUsers(
      users
    ) {

      const list =
        $("usersList");


      if (!users.length) {

        list.innerHTML =
          `
          <div class="empty-state">
            هنوز کاربر دیگری برای نمایش وجود ندارد.
          </div>
          `;

        return;

      }


      list.innerHTML =
        users
          .map(
            user => {

              const name =
                user.display_name ||
                "کاربر";


              const firstLetter =
                escapeHtml(
                  name.charAt(0)
                );


              const avatar =
                user.avatar_url
                  ?
                  `
                  <img
                    src="${escapeHtml(user.avatar_url)}"
                    alt=""
                  >
                  `
                  :
                  firstLetter;


              const date =
                user.created_at
                  ?
                  new Date(
                    user.created_at
                  ).toLocaleDateString(
                    "fa-IR"
                  )
                  :
                  "";


              return `
                <button
                  class="user-card"
                  onclick="openChat('${user.id}')"
                >

                  <div class="avatar">
                    ${avatar}
                  </div>

                  <div class="user-info">

                    <div class="user-name">
                      ${escapeHtml(name)}
                    </div>

                    <div class="user-date">
                      عضو از ${escapeHtml(date)}
                    </div>

                  </div>

                </button>
              `;

            }
          )
          .join("");

    }


    function searchUsers() {

      const query =
        String(
          $("searchInput").value || ""
        )
        .trim()
        .toLowerCase();


      if (!query) {

        renderUsers(
          allUsers
        );

        return;

      }


      const filtered =
        allUsers.filter(
          user =>
            String(
              user.display_name || ""
            )
            .toLowerCase()
            .includes(query)
        );


      renderUsers(
        filtered
      );

    }


    function showProfile() {

      $("homePage")
        .classList.add("hidden");

      $("profilePage")
        .classList.remove("hidden");


      $("profileName").textContent =
        currentProfile?.display_name ||
        "کاربر";


      $("profileEmail").textContent =
        currentUser?.email ||
        "";


      $("editDisplayName").value =
        currentProfile?.display_name ||
        "";


      const avatar =
        $("profileAvatar");


      if (
        currentProfile?.avatar_url
      ) {

        avatar.innerHTML =
          `
          <img
            src="${escapeHtml(
              currentProfile.avatar_url
            )}"
            alt=""
          >
          `;

      } else {

        avatar.textContent =
          (
            currentProfile?.display_name ||
            "👤"
          ).charAt(0);

      }

    }


    async function saveProfile() {

      const name =
        String(
          $("editDisplayName").value || ""
        )
        .trim();


      if (!name) {

        alert(
          "لطفاً نام نمایشی را وارد کن."
        );

        return;

      }


      $("saveProfileBtn").disabled =
        true;


      const {
        error
      } =
        await supabaseClient
          .from("profiles")
          .update({
            display_name: name
          })
          .eq(
            "id",
            currentUser.id
          );


      $("saveProfileBtn").disabled =
        false;


      if (error) {

        console.error(
          "PROFILE UPDATE ERROR:",
          error
        );

        alert(
          "ذخیره ناموفق بود."
        );

        return;

      }


      currentProfile.display_name =
        name;


      $("profileName").textContent =
        name;


      $("welcomeText").textContent =
        "سلام " +
        name +
        " 👋";


      await loadUsers();


      alert(
        "نام نمایشی ذخیره شد."
      );

    }


    function backHome() {

      $("profilePage")
        .classList.add("hidden");

      $("homePage")
        .classList.remove("hidden");

    }


    async function openChat(
      userId
    ) {

      const user =
        allUsers.find(
          u =>
            u.id === userId
        );


      if (!user) return;


      currentChatUser =
        user;


      $("chatUserName")
        .textContent =
        user.display_name ||
        "کاربر";


      if (user.avatar_url) {

        $("chatAvatar").innerHTML =
          `
          <img
            src="${escapeHtml(
              user.avatar_url
            )}"
            alt=""
          >
          `;

      } else {

        $("chatAvatar").textContent =
          (
            user.display_name ||
            "👤"
          ).charAt(0);

      }


      $("chatPage")
        .classList.remove("hidden");


      await loadMessages();


      $("chatInput")
        .focus();


      subscribeToMessages();

    }


    function closeChat() {

      $("chatPage")
        .classList.add("hidden");


      currentChatUser =
        null;


      if (realtimeChannel) {

        supabaseClient
          .removeChannel(
            realtimeChannel
          );

        realtimeChannel =
          null;

      }

    }


    async function loadMessages() {

      if (
        !currentChatUser ||
        !currentUser
      ) return;


      const {
        data,
        error
      } =
        await supabaseClient
          .from("messages")
          .select(
            "id,sender_id,receiver_id,content,created_at"
          )
          .or(
            `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUser.id}),and(sender_id.eq.${currentChatUser.id},receiver_id.eq.${currentUser.id})`
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          "MESSAGES ERROR:",
          error
        );

        $("chatMessages").innerHTML =
          `
          <div class="empty-state">
            خطا در دریافت پیام‌ها
          </div>
          `;

        return;

      }


      renderMessages(
        data || []
      );

    }


    function renderMessages(
      messages
    ) {

      const box =
        $("chatMessages");


      if (!messages.length) {

        box.innerHTML =
          `
          <div class="empty-state">
            هنوز پیامی وجود ندارد.<br>
            اولین پیام را تو بفرست 👋
          </div>
          `;

        return;

      }


      box.innerHTML =
        messages
          .map(
            message => {

              const mine =
                message.sender_id ===
                currentUser.id;


              return `
                <div
                  class="message ${
                    mine
                      ? "mine"
                      : "theirs"
                  }"
                >
                  ${escapeHtml(
                    message.content
                  )}
                </div>
              `;

            }
          )
          .join("");


      box.scrollTop =
        box.scrollHeight;

    }


    async function sendMessage() {

      if (
        !currentChatUser ||
        !currentUser
      ) return;


      const input =
        $("chatInput");


      const content =
        String(
          input.value || ""
        ).trim();


      if (!content) return;


      input.value = "";


      const {
        error
      } =
        await supabaseClient
          .from("messages")
          .insert({
            sender_id:
              currentUser.id,

            receiver_id:
              currentChatUser.id,

            content:
              content
          });


      if (error) {

        console.error(
          "SEND MESSAGE ERROR:",
          error
        );

        alert(
          "پیام ارسال نشد."
        );

        input.value =
          content;

      }

    }


    function subscribeToMessages() {

      if (realtimeChannel) {

        supabaseClient
          .removeChannel(
            realtimeChannel
          );

      }


      realtimeChannel =
        supabaseClient
          .channel(
            "chat-" +
            currentUser.id +
            "-" +
            currentChatUser.id
          )
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "messages"
            },
            payload => {

              const message =
                payload.new;


              if (
                (
                  message.sender_id ===
                    currentUser.id &&
                  message.receiver_id ===
                    currentChatUser.id
                ) ||
                (
                  message.sender_id ===
                    currentChatUser.id &&
                  message.receiver_id ===
                    currentUser.id
                )
              ) {

                loadMessages();

              }

            }
          )
          .subscribe();

    }


    async function login() {

      hideAuthMessage();


      const email =
        $("loginEmail")
          .value
          .trim();


      const password =
        $("loginPassword")
          .value;


      if (
        !email ||
        !password
      ) {

        showAuthMessage(
          "ایمیل و رمز عبور را وارد کن."
        );

        return;

      }


      $("loginBtn").disabled =
        true;


      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });


      $("loginBtn").disabled =
        false;


      if (error) {

        console.error(
          "LOGIN ERROR:",
          error
        );

        showAuthMessage(
          "ایمیل یا رمز عبور اشتباه است."
        );

        return;

      }


      await loadApp(
        data.user
      );

    }


    async function signup() {

      hideAuthMessage();


      const name =
        $("signupName")
          .value
          .trim();


      const email =
        $("signupEmail")
          .value
          .trim();


      const password =
        $("signupPassword")
          .value;


      if (!name) {

        showAuthMessage(
          "نام نمایشی را وارد کن."
        );

        return;

      }


      if (!email) {

        showAuthMessage(
          "ایمیل را وارد کن."
        );

        return;

      }


      if (
        password.length < 6
      ) {

        showAuthMessage(
          "رمز عبور باید حداقل ۶ کاراکتر باشد."
        );

        return;

      }


      $("signupBtn").disabled =
        true;


      const {
        data,
        error
      } =
        await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            data: {
              display_name: name
            }
          }
        });


      $("signupBtn").disabled =
        false;


      if (error) {

        console.error(
          "SIGNUP ERROR:",
          error
        );

        showAuthMessage(
          error.message ||
          "ثبت‌نام انجام نشد."
        );

        return;

      }


      if (data.user) {

        /*
          پروفایل تازه ساخته می‌شود
          و approved به صورت پیش‌فرض false است.
        */

        await createProfile(
          data.user,
          name
        );

      }


      showAuthMessage(
        "ثبت‌نام انجام شد. حساب شما باید توسط مدیر تأیید شود. بعد از تأیید می‌توانید وارد برنامه شوید."
      );

    }


    async function logout() {

      if (realtimeChannel) {

        await supabaseClient
          .removeChannel(
            realtimeChannel
          );

        realtimeChannel =
          null;

      }


      await supabaseClient.auth.signOut();

      currentUser =
        null;

      currentProfile =
        null;

      currentChatUser =
        null;


      $("appPage")
        .classList.add("hidden");

      $("chatPage")
        .classList.add("hidden");

      $("profilePage")
        .classList.add("hidden");

      $("homePage")
        .classList.remove("hidden");


      showAuth();

    }


    /* EVENTS */


    $("loginBtn")
      .addEventListener(
        "click",
        login
      );


    $("signupBtn")
      .addEventListener(
        "click",
        signup
      );


    $("showSignupBtn")
      .addEventListener(
        "click",
        () => {

          hideAuthMessage();

          $("loginForm")
            .classList.add("hidden");

          $("signupForm")
            .classList.remove("hidden");

        }
      );


    $("showLoginBtn")
      .addEventListener(
        "click",
        () => {

          hideAuthMessage();

          $("signupForm")
            .classList.add("hidden");

          $("loginForm")
            .classList.remove("hidden");

        }
      );


    $("logoutBtn")
      .addEventListener(
        "click",
        logout
      );


    $("profileBtn")
      .addEventListener(
        "click",
        showProfile
      );


    $("backHomeBtn")
      .addEventListener(
        "click",
        backHome
      );


    $("saveProfileBtn")
      .addEventListener(
        "click",
        saveProfile
      );


    $("searchInput")
      .addEventListener(
        "input",
        searchUsers
      );


    $("closeChatBtn")
      .addEventListener(
        "click",
        closeChat
      );


    $("sendBtn")
      .addEventListener(
        "click",
        sendMessage
      );


    $("chatInput")
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key ===
            "Enter"
          ) {

            event.preventDefault();

            sendMessage();

          }

        }
      );


    $("loginPassword")
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key ===
            "Enter"
          ) {

            login();

          }

        }
      );


    $("signupPassword")
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key ===
            "Enter"
          ) {

            signup();

          }

        }
      );


    /* AUTH STATE */


    async function init() {

      try {

        const {
          data
        } =
          await supabaseClient
            .auth
            .getSession();


        if (
          data.session?.user
        ) {

          await loadApp(
            data.session.user
          );

        } else {

          showAuth();

        }

      } catch (error) {

        console.error(
          "INIT ERROR:",
          error
        );

        showAuth();

      }

    }


    supabaseClient
      .auth
      .onAuthStateChange(
        async (
          event,
          session
        ) => {

          if (
            event ===
              "SIGNED_OUT"
          ) {

            showAuth();

            return;

          }

          if (
            event ===
              "SIGNED_IN" &&
            session?.user
          ) {

            await loadApp(
              session.user
            );

          }

        }
      );


    /* SERVICE WORKER */


    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        () => {

          navigator
            .serviceWorker
            .register(
              "./service-worker.js"
            )
            .catch(
              error =>
                console.error(
                  "SW ERROR:",
                  error
                )
            );

        }
      );

    }


    init();

  </script>

</body>
</html>
