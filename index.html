<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="./manifest.json">

  <title>دوستانه</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .screen {
      min-height: 100vh;
    }

    /* =========================
       AUTH
    ========================= */

    #authScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
    }

    .auth-box {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.18);
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 15px;
      border-radius: 20px;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    .auth-title {
      text-align: center;
      margin: 0 0 7px;
      font-size: 27px;
    }

    .auth-subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #475569;
    }

    .field input {
      width: 100%;
      border: 1px solid #dbe2ea;
      border-radius: 13px;
      padding: 13px 14px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    .field input:focus {
      border-color: #2563eb;
    }

    .primary-btn {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 14px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .secondary-btn {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 13px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 15px;
      margin-top: 10px;
    }

    .auth-message {
      margin-top: 15px;
      padding: 11px;
      border-radius: 11px;
      background: #f1f5f9;
      color: #334155;
      line-height: 1.8;
      font-size: 14px;
    }

    /* =========================
       APP
    ========================= */

    #appScreen {
      background: #f5f7fb;
    }

    .app-header {
      height: 64px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-title {
      font-size: 20px;
      font-weight: bold;
    }

    .header-actions {
      display: flex;
      gap: 7px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 12px;
      background: #f1f5f9;
      font-size: 20px;
    }

    .icon-btn:active {
      transform: scale(.95);
    }

    .app-content {
      max-width: 800px;
      margin: auto;
      padding: 16px;
    }

    .welcome-card {
      background: linear-gradient(135deg,#2563eb,#4f46e5);
      color: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 15px;
    }

    .welcome-card h2 {
      margin: 0 0 7px;
    }

    .welcome-card p {
      margin: 0;
      opacity: .9;
    }

    .search-box {
      margin-bottom: 15px;
    }

    .search-box input {
      width: 100%;
      padding: 14px;
      border: 1px solid #dbe2ea;
      border-radius: 14px;
      font-size: 15px;
      outline: none;
    }

    .users-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .user-card {
      background: white;
      border-radius: 17px;
      padding: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #edf0f4;
    }

    .user-card:active {
      transform: scale(.99);
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #dbeafe;
      color: #1d4ed8;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: bold;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-info {
      min-width: 0;
      flex: 1;
    }

    .user-name {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .user-status {
      font-size: 12px;
      color: #64748b;
    }

    /* =========================
       PROFILE
    ========================= */

    .page-card {
      background: white;
      border-radius: 20px;
      padding: 20px;
    }

    .page-card h2 {
      margin-top: 0;
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin: 10px auto 20px;
      background: #dbeafe;
      color: #1d4ed8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      overflow: hidden;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .back-btn {
      width: 100%;
      border: 0;
      padding: 13px;
      border-radius: 13px;
      background: #f1f5f9;
      margin-top: 10px;
      font-size: 15px;
    }

    /* =========================
       CHAT
    ========================= */

    #chatPage {
      position: fixed;
      inset: 0;
      background: #f5f7fb;
      z-index: 100;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      height: 64px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
    }

    .chat-title {
      font-weight: bold;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message-row {
      display: flex;
      margin-bottom: 9px;
    }

    .message-row.mine {
      justify-content: flex-start;
    }

    .message-row.theirs {
      justify-content: flex-end;
    }

    .message-bubble {
      max-width: 78%;
      padding: 10px 13px;
      border-radius: 16px;
      line-height: 1.7;
      word-break: break-word;
    }

    .mine .message-bubble {
      background: #2563eb;
      color: white;
      border-bottom-left-radius: 4px;
    }

    .theirs .message-bubble {
      background: white;
      border: 1px solid #e5e7eb;
      border-bottom-right-radius: 4px;
    }

    .chat-input-area {
      background: white;
      border-top: 1px solid #e5e7eb;
      padding: 10px;
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      border: 1px solid #dbe2ea;
      border-radius: 14px;
      padding: 12px;
      font-size: 15px;
      outline: none;
    }

    .send-btn {
      width: 48px;
      border: 0;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 20px;
    }

    /* =========================
       ADMIN
    ========================= */

    #adminPage {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: #f5f7fb;
      overflow-y: auto;
    }

    .admin-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .admin-header h2 {
      margin: 0;
      font-size: 19px;
    }

    .admin-content {
      max-width: 850px;
      margin: auto;
      padding: 15px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .stat-card {
      background: white;
      border-radius: 17px;
      padding: 17px;
      border: 1px solid #edf0f4;
    }

    .stat-number {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .stat-label {
      color: #64748b;
      font-size: 13px;
    }

    .admin-toolbar {
      background: white;
      border-radius: 17px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 8px;
    }

    .admin-toolbar button {
      flex: 1;
      border: 0;
      border-radius: 11px;
      padding: 11px;
      background: #eef2ff;
      color: #3730a3;
    }

    .admin-user {
      background: white;
      border-radius: 17px;
      padding: 13px;
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #edf0f4;
    }

    .admin-user-info {
      flex: 1;
      min-width: 0;
    }

    .admin-user-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .admin-user-date {
      font-size: 11px;
      color: #94a3b8;
    }

    .approval-btn {
      border: 0;
      border-radius: 11px;
      padding: 9px 11px;
      font-size: 12px;
      white-space: nowrap;
    }

    .approval-on {
      background: #dcfce7;
      color: #166534;
    }

    .approval-off {
      background: #fee2e2;
      color: #991b1b;
    }

    .admin-badge {
      display: inline-block;
      margin-top: 5px;
      padding: 3px 7px;
      border-radius: 7px;
      background: #ede9fe;
      color: #6d28d9;
      font-size: 11px;
    }

    .loading {
      text-align: center;
      color: #64748b;
      padding: 25px;
    }

    .error-box {
      background: #fee2e2;
      color: #991b1b;
      padding: 13px;
      border-radius: 13px;
      line-height: 1.8;
    }

    @media (min-width: 600px) {
      .stats-grid {
        grid-template-columns: repeat(4,1fr);
      }
    }
  </style>
</head>

<body>

<!-- =========================
     AUTH
========================= -->

<section id="authScreen" class="screen">
  <div class="auth-box">

    <div class="logo">💬</div>

    <h1 class="auth-title">دوستانه</h1>

    <div class="auth-subtitle">
      پیام‌رسان ساده و خصوصی
    </div>

    <div id="nameField" class="field">
      <label>نام نمایشی</label>
      <input id="nameInput" type="text" placeholder="مثلاً صابر">
    </div>

    <div class="field">
      <label>ایمیل</label>
      <input id="emailInput" type="email" placeholder="example@gmail.com">
    </div>

    <div class="field">
      <label>رمز عبور</label>
      <input id="passwordInput" type="password" placeholder="حداقل ۶ کاراکتر">
    </div>

    <button id="authButton" class="primary-btn">
      ثبت‌نام
    </button>

    <button id="switchAuthButton" class="secondary-btn">
      ورود به حساب
    </button>

    <div id="authMessage" class="auth-message hidden"></div>

  </div>
</section>


<!-- =========================
     MAIN APP
========================= -->

<section id="appScreen" class="screen hidden">

  <header class="app-header">

    <div class="header-title">
      دوستانه
    </div>

    <div class="header-actions">

      <button
        id="adminBtn"
        class="icon-btn hidden"
        title="مدیریت">
        🛡️
      </button>

      <button
        id="profileBtn"
        class="icon-btn"
        title="پروفایل">
        👤
      </button>

      <button
        id="logoutBtn"
        class="icon-btn"
        title="خروج">
        🚪
      </button>

    </div>

  </header>

  <main class="app-content">

    <div class="welcome-card">
      <h2 id="welcomeText">سلام 👋</h2>
      <p>دوستانت رو پیدا کن و باهاشون گفتگو کن.</p>
    </div>

    <div class="search-box">
      <input
        id="searchInput"
        type="search"
        placeholder="جستجوی کاربر..."
      >
    </div>

    <div id="usersList" class="users-list">
      <div class="loading">در حال بارگذاری...</div>
    </div>

  </main>

</section>


<!-- =========================
     PROFILE
========================= -->

<section id="profilePage" class="screen hidden">

  <div class="app-content">

    <div class="page-card">

      <h2>پروفایل من</h2>

      <div id="profileAvatar" class="profile-avatar">
        👤
      </div>

      <div class="field">
        <label>نام نمایشی</label>
        <input id="profileNameInput" type="text">
      </div>

      <button id="saveProfileBtn" class="primary-btn">
        ذخیره تغییرات
      </button>

      <button id="backProfileBtn" class="back-btn">
        بازگشت
      </button>

    </div>

  </div>

</section>


<!-- =========================
     CHAT
========================= -->

<section id="chatPage" class="hidden">

  <header class="chat-header">

    <button id="backChatBtn" class="icon-btn">
      ➜
    </button>

    <div id="chatAvatar" class="avatar">
      👤
    </div>

    <div id="chatTitle" class="chat-title">
      گفتگو
    </div>

  </header>

  <div id="messagesList" class="messages">
  </div>

  <div class="chat-input-area">

    <input
      id="messageInput"
      class="chat-input"
      type="text"
      placeholder="پیامت رو بنویس..."
      autocomplete="off"
    >

    <button id="sendMessageBtn" class="send-btn">
      ➤
    </button>

  </div>

</section>


<!-- =========================
     ADMIN PANEL
========================= -->

<section id="adminPage" class="hidden">

  <header class="admin-header">

    <h2>🛡️ پنل مدیریت</h2>

    <button id="closeAdminBtn" class="icon-btn">
      ✕
    </button>

  </header>

  <main class="admin-content">

    <div id="adminStats" class="stats-grid">
      <div class="stat-card">
        <div class="stat-number">-</div>
        <div class="stat-label">کاربران</div>
      </div>
    </div>

    <div class="admin-toolbar">

      <button id="refreshAdminBtn">
        🔄 بروزرسانی
      </button>

    </div>

    <div id="adminUsersList">
      <div class="loading">
        در حال بارگذاری کاربران...
      </div>
    </div>

  </main>

</section>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  /* =====================================================
     SUPABASE
  ===================================================== */

  const SUPABASE_URL =
    "https://uobviepglysngosuomph.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_ki1URRpDpSc-E5h5HQiq3w_2_-LHIHa";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =====================================================
     STATE
  ===================================================== */

  let currentUser = null;
  let currentProfile = null;

  let allUsers = [];

  let currentChatUser = null;

  let messageChannel = null;

  let authMode = "signup";

  let isAdmin = false;

  let approvalCheckTimer = null;


  /* =====================================================
     HELPERS
  ===================================================== */

  const $ = id => document.getElementById(id);


  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function getInitial(name) {

    const text = String(name || "کاربر").trim();

    return text ? text.charAt(0) : "👤";

  }


  function formatDate(date) {

    try {

      return new Date(date).toLocaleDateString(
        "fa-IR",
        {
          year: "numeric",
          month: "long",
          day: "numeric"
        }
      );

    } catch {

      return "";

    }

  }


  function showAuthMessage(message) {

    $("authMessage").textContent = message;

    $("authMessage").classList.remove("hidden");

  }


  function hideAuthMessage() {

    $("authMessage").classList.add("hidden");

  }


  function showAuth() {

    $("authScreen").classList.remove("hidden");

    $("appScreen").classList.add("hidden");

    $("profilePage").classList.add("hidden");

    $("adminPage").classList.add("hidden");

    $("chatPage").classList.add("hidden");

  }


  function showApp() {

    $("authScreen").classList.add("hidden");

    $("appScreen").classList.remove("hidden");

    $("profilePage").classList.add("hidden");

    $("adminPage").classList.add("hidden");

    $("chatPage").classList.add("hidden");

  }


  /* =====================================================
     AUTH MODE
  ===================================================== */

  function setAuthMode(mode) {

    authMode = mode;

    hideAuthMessage();

    if (mode === "signup") {

      $("nameField").classList.remove("hidden");

      $("authButton").textContent = "ثبت‌نام";

      $("switchAuthButton").textContent =
        "قبلاً حساب داری؟ ورود";

    } else {

      $("nameField").classList.add("hidden");

      $("authButton").textContent = "ورود";

      $("switchAuthButton").textContent =
        "حساب نداری؟ ثبت‌نام";

    }

  }


  $("switchAuthButton").addEventListener(
    "click",
    () => {

      setAuthMode(
        authMode === "signup"
          ? "login"
          : "signup"
      );

    }
  );


  /* =====================================================
     SIGNUP / LOGIN
  ===================================================== */

  $("authButton").addEventListener(
    "click",
    async () => {

      hideAuthMessage();

      const email =
        $("emailInput").value.trim();

      const password =
        $("passwordInput").value;

      const name =
        $("nameInput").value.trim();


      if (!email || !password) {

        showAuthMessage(
          "ایمیل و رمز عبور را وارد کن."
        );

        return;

      }


      if (authMode === "signup") {

        if (!name) {

          showAuthMessage(
            "لطفاً نام نمایشی را وارد کن."
          );

          return;

        }

        if (password.length < 6) {

          showAuthMessage(
            "رمز عبور باید حداقل ۶ کاراکتر باشد."
          );

          return;

        }


        const {
          data,
          error
        } =
          await supabaseClient.auth.signUp({

            email,

            password,

            options: {

              data: {
                display_name: name
              }

            }

          });


        if (error) {

          showAuthMessage(
            error.message
          );

          return;

        }


        showAuthMessage(
          "ثبت‌نام انجام شد. حساب شما باید توسط مدیر تأیید شود. اگر تأیید ایمیل فعال باشد، ابتدا ایمیل خود را تأیید کن."
        );

        $("passwordInput").value = "";

        return;

      }


      /* LOGIN */

      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({

          email,

          password

        });


      if (error) {

        showAuthMessage(
          "ورود انجام نشد: " +
          error.message
        );

        return;

      }


      if (data?.user) {

        await loadApp(data.user);

      }

    }
  );


  /* =====================================================
     LOAD APP
  ===================================================== */

  async function loadApp(user) {

    currentUser = user;


    const {
      data: profile,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id,display_name,avatar_url,created_at,updated_at,approved"
        )
        .eq("id", user.id)
        .maybeSingle();


    if (error) {

      console.error(error);

      await supabaseClient.auth.signOut();

      showAuth();

      showAuthMessage(
        "خطا در دریافت اطلاعات حساب."
      );

      return;

    }


    if (!profile) {

      await supabaseClient.auth.signOut();

      showAuth();

      showAuthMessage(
        "پروفایل حساب هنوز ساخته نشده است. دوباره بعداً تلاش کن."
      );

      return;

    }


    currentProfile = profile;


    if (profile.approved !== true) {

      await supabaseClient.auth.signOut();

      currentUser = null;
      currentProfile = null;

      showAuth();

      showAuthMessage(
        "ثبت‌نام شما انجام شده است، اما هنوز توسط مدیر تأیید نشده‌اید."
      );

      return;

    }


    showApp();


    $("welcomeText").textContent =
      "سلام " +
      (profile.display_name || "دوست من") +
      " 👋";


    $("profileNameInput").value =
      profile.display_name || "";


    renderProfileAvatar();


    await loadUsers();


    /*
      اینجا با Edge Function بررسی می‌کنیم
      آیا کاربر مدیر است یا نه.
      هیچ is_admin از سمت مرورگر خوانده نمی‌شود.
    */

    await detectAdmin();


    startApprovalWatcher();

  }


  /* =====================================================
     USERS
  ===================================================== */

  async function loadUsers() {

    if (!currentUser) return;


    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id,display_name,avatar_url,created_at"
        )
        .neq("id", currentUser.id)
        .order(
          "display_name",
          { ascending: true }
        );


    if (error) {

      console.error(error);

      $("usersList").innerHTML =
        `<div class="error-box">
          خطا در دریافت کاربران.
        </div>`;

      return;

    }


    allUsers = data || [];

    renderUsers(allUsers);

  }


  function renderUsers(users) {

    if (!users.length) {

      $("usersList").innerHTML =
        `<div class="page-card">
          هنوز کاربر دیگری وجود ندارد.
        </div>`;

      return;

    }


    $("usersList").innerHTML =
      users.map(user => {

        const name =
          user.display_name ||
          "کاربر";


        const avatar =
          user.avatar_url
            ? `<img src="${escapeHtml(user.avatar_url)}" alt="">`
            : escapeHtml(
                getInitial(name)
              );


        return `

          <div
            class="user-card"
            data-user-id="${escapeHtml(user.id)}"
          >

            <div class="avatar">
              ${avatar}
            </div>

            <div class="user-info">

              <div class="user-name">
                ${escapeHtml(name)}
              </div>

              <div class="user-status">
                آماده گفتگو
              </div>

            </div>

          </div>

        `;

      }).join("");


    document
      .querySelectorAll(".user-card")
      .forEach(card => {

        card.addEventListener(
          "click",
          () => {

            const user =
              allUsers.find(
                x =>
                  x.id ===
                  card.dataset.userId
              );

            if (user) {

              openChat(user);

            }

          }
        );

      });

  }


  $("searchInput").addEventListener(
    "input",
    () => {

      const q =
        $("searchInput")
          .value
          .trim()
          .toLowerCase();


      if (!q) {

        renderUsers(allUsers);

        return;

      }


      const filtered =
        allUsers.filter(user =>
          String(
            user.display_name || ""
          )
          .toLowerCase()
          .includes(q)
        );


      renderUsers(filtered);

    }
  );


  /* =====================================================
     PROFILE
  ===================================================== */

  function renderProfileAvatar() {

    const name =
      currentProfile?.display_name ||
      "کاربر";


    if (currentProfile?.avatar_url) {

      $("profileAvatar").innerHTML =
        `<img src="${escapeHtml(
          currentProfile.avatar_url
        )}" alt="">`;

    } else {

      $("profileAvatar").textContent =
        getInitial(name);

    }

  }


  $("profileBtn").addEventListener(
    "click",
    () => {

      $("appScreen").classList.add("hidden");

      $("profilePage").classList.remove("hidden");

      $("profileNameInput").value =
        currentProfile?.display_name || "";

      renderProfileAvatar();

    }
  );


  $("backProfileBtn").addEventListener(
    "click",
    () => {

      $("profilePage").classList.add("hidden");

      $("appScreen").classList.remove("hidden");

    }
  );


  $("saveProfileBtn").addEventListener(
    "click",
    async () => {

      if (!currentUser) return;


      const name =
        $("profileNameInput")
          .value
          .trim();


      if (!name) {

        alert("نام نمایشی را وارد کن.");

        return;

      }


      const {
        error
      } =
        await supabaseClient
          .from("profiles")
          .update({
            display_name: name
          })
          .eq(
            "id",
            currentUser.id
          );


      if (error) {

        alert(
          "ذخیره نشد: " +
          error.message
        );

        return;

      }


      currentProfile.display_name =
        name;


      $("welcomeText").textContent =
        "سلام " +
        name +
        " 👋";


      renderProfileAvatar();

      $("profilePage").classList.add("hidden");

      $("appScreen").classList.remove("hidden");

      await loadUsers();

    }
  );


  /* =====================================================
     CHAT
  ===================================================== */

  async function openChat(user) {

    currentChatUser = user;


    $("chatTitle").textContent =
      user.display_name ||
      "کاربر";


    if (user.avatar_url) {

      $("chatAvatar").innerHTML =
        `<img src="${escapeHtml(
          user.avatar_url
        )}" alt="">`;

    } else {

      $("chatAvatar").textContent =
        getInitial(
          user.display_name
        );

    }


    $("chatPage").classList.remove("hidden");

    await loadMessages();

    subscribeToMessages();

  }


  $("backChatBtn").addEventListener(
    "click",
    () => {

      closeChat();

    }
  );


  function closeChat() {

    $("chatPage").classList.add("hidden");

    currentChatUser = null;

    if (messageChannel) {

      supabaseClient
        .removeChannel(
          messageChannel
        );

      messageChannel = null;

    }

  }


  async function loadMessages() {

    if (
      !currentUser ||
      !currentChatUser
    ) return;


    const {
      data,
      error
    } =
      await supabaseClient
        .from("messages")
        .select(
          "id,sender_id,receiver_id,content,created_at"
        )
        .or(
          `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUser.id}),and(sender_id.eq.${currentChatUser.id},receiver_id.eq.${currentUser.id})`
        )
        .order(
          "created_at",
          { ascending: true }
        );


    if (error) {

      console.error(error);

      $("messagesList").innerHTML =
        `<div class="error-box">
          امکان دریافت پیام‌ها وجود ندارد.
        </div>`;

      return;

    }


    renderMessages(data || []);

  }


  function renderMessages(messages) {

    $("messagesList").innerHTML = "";


    messages.forEach(message => {

      appendMessage(message);

    });


    scrollMessagesToBottom();

  }


  function appendMessage(message) {

    const mine =
      message.sender_id ===
      currentUser.id;


    const row =
      document.createElement("div");


    row.className =
      "message-row " +
      (mine ? "mine" : "theirs");


    const bubble =
      document.createElement("div");


    bubble.className =
      "message-bubble";


    bubble.textContent =
      message.content;


    row.appendChild(bubble);

    $("messagesList")
      .appendChild(row);

  }


  function scrollMessagesToBottom() {

    const box =
      $("messagesList");

    box.scrollTop =
      box.scrollHeight;

  }


  function subscribeToMessages() {

    if (
      !currentUser ||
      !currentChatUser
    ) return;


    if (messageChannel) {

      supabaseClient
        .removeChannel(
          messageChannel
        );

    }


    messageChannel =
      supabaseClient
        .channel(
          "messages-" +
          currentUser.id +
          "-" +
          currentChatUser.id
        )
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "messages"
          },
          payload => {

            const message =
              payload.new;


            const relevant =
              (
                message.sender_id ===
                currentUser.id &&
                message.receiver_id ===
                currentChatUser.id
              ) ||
              (
                message.sender_id ===
                currentChatUser.id &&
                message.receiver_id ===
                currentUser.id
              );


            if (relevant) {

              appendMessage(message);

              scrollMessagesToBottom();

            }

          }
        )
        .subscribe();

  }


  async function sendMessage() {

    if (
      !currentUser ||
      !currentChatUser
    ) return;


    const input =
      $("messageInput");


    const content =
      input.value.trim();


    if (!content) return;


    input.value = "";


    const {
      error
    } =
      await supabaseClient
        .from("messages")
        .insert({

          sender_id:
            currentUser.id,

          receiver_id:
            currentChatUser.id,

          content

        });


    if (error) {

      console.error(error);

      alert(
        "پیام ارسال نشد: " +
        error.message
      );

      input.value = content;

    }

  }


  $("sendMessageBtn").addEventListener(
    "click",
    sendMessage
  );


  $("messageInput").addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  /* =====================================================
     ADMIN
  ===================================================== */

  async function adminRequest(body) {

    /*
      supabase-js توکن نشست فعلی را
      برای Edge Function می‌فرستد.
    */

    const {
      data,
      error
    } =
      await supabaseClient.functions.invoke(
        "admin-panel",
        {
          body
        }
      );


    if (error) {

      throw error;

    }


    return data;

  }


  async function detectAdmin() {

    isAdmin = false;

    $("adminBtn")
      .classList.add("hidden");


    try {

      await adminRequest({
        action: "list"
      });


      /*
        اگر درخواست با موفقیت انجام شد،
        سرور کاربر را مدیر شناخته.
      */

      isAdmin = true;

      $("adminBtn")
        .classList.remove("hidden");

    } catch (error) {

      /*
        403 برای کاربر معمولی طبیعی است.
      */

      isAdmin = false;

      $("adminBtn")
        .classList.add("hidden");

      console.log(
        "Admin access:",
        error.message
      );

    }

  }


  $("adminBtn").addEventListener(
    "click",
    async () => {

      if (!isAdmin) return;

      $("appScreen")
        .classList.add("hidden");

      $("adminPage")
        .classList.remove("hidden");

      await loadAdminPanel();

    }
  );


  $("closeAdminBtn").addEventListener(
    "click",
    () => {

      $("adminPage")
        .classList.add("hidden");

      $("appScreen")
        .classList.remove("hidden");

    }
  );


  $("refreshAdminBtn").addEventListener(
    "click",
    loadAdminPanel
  );


  async function loadAdminPanel() {

    const container =
      $("adminUsersList");


    container.innerHTML =
      `<div class="loading">
        در حال دریافت اطلاعات...
      </div>`;


    try {

      const result =
        await adminRequest({
          action: "list"
        });


      isAdmin = true;


      const stats =
        result.stats || {};


      $("adminStats").innerHTML = `

        <div class="stat-card">
          <div class="stat-number">
            ${stats.total_users ?? 0}
          </div>
          <div class="stat-label">
            کل کاربران
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-number">
            ${stats.approved_users ?? 0}
          </div>
          <div class="stat-label">
            تأیید شده
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-number">
            ${stats.pending_users ?? 0}
          </div>
          <div class="stat-label">
            در انتظار
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-number">
            ${stats.total_messages ?? 0}
          </div>
          <div class="stat-label">
            کل پیام‌ها
          </div>
        </div>

      `;


      renderAdminUsers(
        result.users || []
      );


    } catch (error) {

      console.error(error);

      isAdmin = false;

      $("adminBtn")
        .classList.add("hidden");

      container.innerHTML =
        `<div class="error-box">
          دسترسی به پنل مدیریت وجود ندارد.
        </div>`;

    }

  }


  function renderAdminUsers(users) {

    if (!users.length) {

      $("adminUsersList").innerHTML =
        `<div class="page-card">
          هنوز کاربری وجود ندارد.
        </div>`;

      return;

    }


    $("adminUsersList").innerHTML =
      users.map(user => {

        const isMe =
          user.id ===
          currentUser.id;


        const name =
          user.display_name ||
          "کاربر";


        const avatar =
          user.avatar_url
            ? `<img src="${escapeHtml(
                user.avatar_url
              )}" alt="">`
            : escapeHtml(
                getInitial(name)
              );


        let action = "";


        if (isMe) {

          action = `
            <span class="admin-badge">
              مدیر
            </span>
          `;

        } else {

          action = `

            <button
              class="
                approval-btn
                ${user.approved
                  ? "approval-on"
                  : "approval-off"}
              "
              data-approval-id="${escapeHtml(user.id)}"
              data-approved="${user.approved ? "true" : "false"}"
            >

              ${
                user.approved
                  ? "فعال ✓"
                  : "تأیید نشده"
              }

            </button>

          `;

        }


        return `

          <div class="admin-user">

            <div class="avatar">
              ${avatar}
            </div>

            <div class="admin-user-info">

              <div class="admin-user-name">
                ${escapeHtml(name)}
              </div>

              <div class="admin-user-date">
                عضویت:
                ${formatDate(user.created_at)}
              </div>

              <div class="admin-user-date">
                پیام‌ها:
                ${user.message_count ?? 0}
              </div>

            </div>

            ${action}

          </div>

        `;

      }).join("");


    document
      .querySelectorAll(
        "[data-approval-id]"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          async () => {

            const userId =
              button.dataset.approvalId;


            const oldValue =
              button.dataset.approved ===
              "true";


            const newValue =
              !oldValue;


            const confirmed =
              confirm(
                newValue
                  ? "این کاربر فعال شود؟"
                  : "اجازه ورود این کاربر لغو شود؟"
              );


            if (!confirmed) return;


            button.disabled = true;


            try {

              await adminRequest({

                action:
                  "set_approval",

                target_user_id:
                  userId,

                approved:
                  newValue

              });


              await loadAdminPanel();


            } catch (error) {

              console.error(error);

              alert(
                "تغییر وضعیت انجام نشد: " +
                error.message
              );

              button.disabled = false;

            }

          }
        );

      });

  }


  /* =====================================================
     APPROVAL WATCHER
  ===================================================== */

  function startApprovalWatcher() {

    if (approvalCheckTimer) {

      clearInterval(
        approvalCheckTimer
      );

    }


    /*
      هر ۳۰ ثانیه وضعیت تأیید حساب
      بررسی می‌شود.
    */

    approvalCheckTimer =
      setInterval(
        checkApproval,
        30000
      );

  }


  async function checkApproval() {

    if (!currentUser) return;


    /*
      مدیر هم باید از همین مسیر بررسی شود.
      این فقط approved را می‌خواند.
    */

    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select("approved")
        .eq(
          "id",
          currentUser.id
        )
        .maybeSingle();


    if (error || !data) return;


    if (data.approved !== true) {

      if (approvalCheckTimer) {

        clearInterval(
          approvalCheckTimer
        );

        approvalCheckTimer = null;

      }


      await supabaseClient.auth.signOut();


      currentUser = null;
      currentProfile = null;
      isAdmin = false;


      showAuth();

      showAuthMessage(
        "اجازه ورود حساب شما توسط مدیر لغو شده است."
      );

    }

  }


  /* =====================================================
     LOGOUT
  ===================================================== */

  $("logoutBtn").addEventListener(
    "click",
    async () => {

      if (approvalCheckTimer) {

        clearInterval(
          approvalCheckTimer
        );

        approvalCheckTimer = null;

      }


      if (messageChannel) {

        await supabaseClient
          .removeChannel(
            messageChannel
          );

        messageChannel = null;

      }


      await supabaseClient.auth.signOut();


      currentUser = null;
      currentProfile = null;
      currentChatUser = null;
      isAdmin = false;


      showAuth();

      hideAuthMessage();

    }
  );


  /* =====================================================
     AUTH STATE
  ===================================================== */

  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      if (
        session?.user &&
        (
          event === "SIGNED_IN" ||
          event === "INITIAL_SESSION"
        )
      ) {

        await loadApp(
          session.user
        );

      }

    }
  );


  /* =====================================================
     PWA
  ===================================================== */

  if ("serviceWorker" in navigator) {

    window.addEventListener(
      "load",
      () => {

        navigator.serviceWorker
          .register(
            "./service-worker.js"
          )
          .catch(error => {

            console.error(
              "SW error:",
              error
            );

          });

      }
    );

  }


  /* =====================================================
     INIT
  ===================================================== */

  async function init() {

    setAuthMode("signup");


    const {
      data
    } =
      await supabaseClient.auth.getSession();


    if (data?.session?.user) {

      await loadApp(
        data.session.user
      );

    } else {

      showAuth();

    }

  }


  init();

</script>
