<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="manifest" href="./manifest.json">

  <title>دوستانه</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .screen {
      min-height: 100vh;
    }

    /* =========================
       AUTH
    ========================= */

    #authScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(
        135deg,
        #2563eb,
        #4f46e5
      );
    }

    .auth-box {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.18);
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 15px;
      border-radius: 20px;
      background: #2563eb;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    .auth-title {
      text-align: center;
      margin: 0 0 7px;
      font-size: 27px;
    }

    .auth-subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: #475569;
      font-size: 14px;
    }

    .field input {
      width: 100%;
      border: 1px solid #dbe2ea;
      border-radius: 13px;
      padding: 13px 14px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    .field input:focus {
      border-color: #2563eb;
    }

    .primary-btn {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 14px;
      background: #2563eb;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
    }

    .primary-btn:disabled {
      opacity: .6;
      cursor: wait;
    }

    .secondary-btn {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 13px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 15px;
      margin-top: 10px;
    }

    .auth-message {
      margin-top: 15px;
      padding: 11px;
      border-radius: 11px;
      background: #f1f5f9;
      color: #334155;
      line-height: 1.8;
      font-size: 14px;
    }

    .auth-message.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .auth-message.success {
      background: #dcfce7;
      color: #166534;
    }

    /* =========================
       APP HEADER
    ========================= */

    #appScreen {
      background: #f5f7fb;
    }

    .app-header {
      height: 64px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-title {
      font-size: 20px;
      font-weight: bold;
    }

    .header-actions {
      display: flex;
      gap: 7px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 12px;
      background: #f1f5f9;
      font-size: 19px;
    }

    .icon-btn:active {
      transform: scale(.95);
    }

    .app-content {
      max-width: 800px;
      margin: auto;
      padding: 16px;
    }

    /* =========================
       WELCOME
    ========================= */

    .welcome-card {
      background: linear-gradient(
        135deg,
        #2563eb,
        #4f46e5
      );
      color: #fff;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 15px;
    }

    .welcome-card h2 {
      margin: 0 0 7px;
    }

    .welcome-card p {
      margin: 0;
      opacity: .9;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-box {
      margin-bottom: 15px;
    }

    .search-box input {
      width: 100%;
      padding: 14px;
      border: 1px solid #dbe2ea;
      border-radius: 14px;
      font-size: 15px;
      outline: none;
    }

    /* =========================
       USERS
    ========================= */

    .users-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .user-card {
      background: #fff;
      border-radius: 17px;
      padding: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #edf0f4;
    }

    .user-card:active {
      transform: scale(.99);
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #dbeafe;
      color: #1d4ed8;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: bold;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-info {
      min-width: 0;
      flex: 1;
    }

    .user-name {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .user-status {
      font-size: 12px;
      color: #64748b;
    }

    /* =========================
       PAGE CARD
    ========================= */

    .page-card {
      background: #fff;
      border-radius: 20px;
      padding: 20px;
    }

    .page-card h2 {
      margin-top: 0;
    }

    /* =========================
       PROFILE
    ========================= */

    #profilePage {
      min-height: 100vh;
      background: #f5f7fb;
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin: 10px auto 20px;
      background: #dbeafe;
      color: #1d4ed8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      overflow: hidden;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .back-btn {
      width: 100%;
      border: 0;
      padding: 13px;
      border-radius: 13px;
      background: #f1f5f9;
      margin-top: 10px;
      font-size: 15px;
    }

    /* =========================
       CHAT
    ========================= */

    #chatPage {
      position: fixed;
      inset: 0;
      background: #f5f7fb;
      z-index: 100;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      height: 64px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
    }

    .chat-title {
      font-weight: bold;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message-row {
      display: flex;
      margin-bottom: 9px;
    }

    .message-row.mine {
      justify-content: flex-start;
    }

    .message-row.theirs {
      justify-content: flex-end;
    }

    .message-bubble {
      max-width: 78%;
      padding: 10px 13px;
      border-radius: 16px;
      line-height: 1.7;
      word-break: break-word;
    }

    .mine .message-bubble {
      background: #2563eb;
      color: #fff;
      border-bottom-left-radius: 4px;
    }

    .theirs .message-bubble {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-bottom-right-radius: 4px;
    }

    .chat-input-area {
      background: #fff;
      border-top: 1px solid #e5e7eb;
      padding: 10px;
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      border: 1px solid #dbe2ea;
      border-radius: 14px;
      padding: 12px;
      font-size: 15px;
      outline: none;
    }

    .send-btn {
      width: 48px;
      border: 0;
      border-radius: 14px;
      background: #2563eb;
      color: #fff;
      font-size: 20px;
    }

    /* =========================
       ADMIN
    ========================= */

    #adminPage {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: #f5f7fb;
      overflow-y: auto;
    }

    .admin-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 11px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .admin-header h2 {
      margin: 0;
      font-size: 19px;
    }

    .admin-content {
      max-width: 850px;
      margin: auto;
      padding: 15px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .stat-card {
      background: #fff;
      border-radius: 17px;
      padding: 17px;
      border: 1px solid #edf0f4;
    }

    .stat-number {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .stat-label {
      color: #64748b;
      font-size: 13px;
    }

    .admin-toolbar {
      background: #fff;
      border-radius: 17px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .admin-toolbar button {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 11px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 14px;
    }

    .admin-user {
      background: #fff;
      border-radius: 17px;
      padding: 13px;
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #edf0f4;
    }

    .admin-user-info {
      flex: 1;
      min-width: 0;
    }

    .admin-user-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .admin-user-date {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .approval-btn {
      border: 0;
      border-radius: 11px;
      padding: 9px 11px;
      font-size: 12px;
      white-space: nowrap;
    }

    .approval-on {
      background: #dcfce7;
      color: #166534;
    }

    .approval-off {
      background: #fee2e2;
      color: #991b1b;
    }

    .admin-badge {
      display: inline-block;
      margin-top: 5px;
      padding: 4px 8px;
      border-radius: 7px;
      background: #ede9fe;
      color: #6d28d9;
      font-size: 11px;
    }

    /* =========================
       GENERAL
    ========================= */

    .loading {
      text-align: center;
      color: #64748b;
      padding: 25px;
    }

    .error-box {
      background: #fee2e2;
      color: #991b1b;
      padding: 13px;
      border-radius: 13px;
      line-height: 1.8;
    }

    @media (min-width: 600px) {

      .stats-grid {
        grid-template-columns: repeat(4, 1fr);
      }

    }

  </style>
</head>


<body>


<!-- =====================================================
     AUTH SCREEN
===================================================== -->

<section id="authScreen" class="screen">

  <div class="auth-box">

    <div class="logo">
      💬
    </div>

    <h1 class="auth-title">
      دوستانه
    </h1>

    <div class="auth-subtitle">
      پیام‌رسان ساده و خصوصی
    </div>


    <div id="nameField" class="field">

      <label>
        نام نمایشی
      </label>

      <input
        id="nameInput"
        type="text"
        placeholder="مثلاً صابر"
        autocomplete="name"
      >

    </div>


    <div class="field">

      <label>
        ایمیل
      </label>

      <input
        id="emailInput"
        type="email"
        placeholder="example@gmail.com"
        autocomplete="email"
      >

    </div>


    <div class="field">

      <label>
        رمز عبور
      </label>

      <input
        id="passwordInput"
        type="password"
        placeholder="حداقل ۶ کاراکتر"
        autocomplete="current-password"
      >

    </div>


    <button
      id="authButton"
      class="primary-btn"
    >
      ثبت‌نام
    </button>


    <button
      id="switchAuthButton"
      class="secondary-btn"
    >
      قبلاً حساب داری؟ ورود
    </button>


    <div
      id="authMessage"
      class="auth-message hidden"
    ></div>

  </div>

</section>



<!-- =====================================================
     MAIN APP
===================================================== -->

<section
  id="appScreen"
  class="screen hidden"
>

  <header class="app-header">

    <div class="header-title">
      دوستانه
    </div>


    <div class="header-actions">

      <button
        id="adminBtn"
        class="icon-btn hidden"
        title="مدیریت"

        🛡️
      </button>


      <button
        id="profileBtn"
        class="icon-btn"

      >
        👤
      </button>


      <button
        id="logoutBtn"
        class="icon-btn"
        title="خروج"

        🚪
      </button>

    </div>

  </header>


  <main class="app-content">


    <div class="welcome-card">

      <h2 id="welcomeText">

      </h2>

      <p>
        دوستانت رو پیدا کن و باهاشون گفتگو کن.
      </p>

    </div>


    <div class="search-box">

      <input
        id="searchInput"
        type="search"

    </div>

    >

</section>



<!-- =====================================================
     PROFILE
===================================================== -->

<section
  id="profilePage"
  class="screen hidden"
>

  <div class="app-content">

    <div class="page-card">

      <h2>
        پروفایل من
      </h2>


      <div
        id="profileAvatar"
        class="profile-avatar"
      >
        👤
      </div>


      <div class="field">

        <label>
          نام نمایشی
        </label>

        <input
          id="profileNameInput"
          type="text"
        >

      </div>


      <button
        id="saveProfileBtn"
        class="primary-btn"
      >
        ذخیره تغییرات
      </button>


      <button
        id="backProfileBtn"
        class="back-btn"
      >
        بازگشت
      </button>

    </div>

  </div>

</section>



<!-- =====================================================
     CHAT
===================================================== -->

<section
  id="chatPage"
  class="hidden"
>

  <header class="chat-header">


    <button
      id="backChatBtn"
      class="icon-btn"
    >
      ➜
    </button>


    <div
      id="chatAvatar"
      class="avatar"
    >
      👤
    </div>


    <div
      id="chatTitle"
      class="chat-title"
    >

    </div>

  </header>


  <div
    id="messagesList"

  <div class="chat-input-area">

    <button

<!-- =====================================================
     ADMIN PANEL
===================================================== -->

<section
  id="adminPage"
  class="hidden"
>

  <header class="admin-header">

    <h2>
      🛡️ پنل مدیریت
    </h2>


    <button
      id="closeAdminBtn"

      ✕
    </button>

  </header>


  <main class="admin-content">


    <div
      id="adminStats"
      class="stats-grid"
    >

      <div class="stat-card">

        <div class="stat-number">
          -
        </div>

        <div class="stat-label">
          کاربران
        </div>

      </div>

    </div>


    <div class="admin-toolbar">

      <button id="refreshAdminBtn">
        🔄 بروزرسانی اطلاعات
      </button>

    </div>


    <div id="adminUsersList">

      <div class="loading">
        در حال بارگذاری کاربران...
      </div>

    </div>

</section>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

  /* =====================================================
     SUPABASE
  ===================================================== */

  const SUPABASE_URL =
    "https://uobviepglysngosuomph.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_ki1URRpDpSc-E5h5HQiq3w_2_-LHIHa";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );



  /* =====================================================
     STATE
  ===================================================== */

  let currentUser = null;

  let currentProfile = null;

  let currentChatUser = null;

  let allUsers = [];

  let messageChannel = null;

  let authMode = "signup";

  let isAdmin = false;

  let isLoadingApp = false;

  let approvalTimer = null;



  /* =====================================================
     HELPERS
  ===================================================== */

  const $ = id =>
    document.getElementById(id);


  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function getInitial(name) {

    const value =
      String(name || "کاربر").trim();

    return value
      ? value.charAt(0)
      : "👤";

  }


  function formatDate(date) {

    try {

      return new Date(date)
        .toLocaleDateString(
          "fa-IR",
          {
            year: "numeric",
            month: "long",
            day: "numeric"
          }
        );

    } catch {

      return "";

    }

  }


  function showAuthMessage(
    message,
    type = ""
  ) {

    const box =
      $("authMessage");

    box.textContent = message;

    box.classList.remove(
      "hidden",
      "error",
      "success"
    );

    if (type) {
      box.classList.add(type);
    }

  }


  function hideAuthMessage() {

    $("authMessage")
      .classList.add("hidden");

  }



  /* =====================================================
     SCREEN CONTROL
  ===================================================== */

  function showAuth() {

    $("authScreen")
      .classList.remove("hidden");

    $("appScreen")
      .classList.add("hidden");

    $("profilePage")
      .classList.add("hidden");

    $("adminPage")
      .classList.add("hidden");

    $("chatPage")
      .classList.add("hidden");

  }


  function showApp() {

    $("authScreen")
      .classList.add("hidden");

    $("appScreen")
      .classList.remove("hidden");

    $("profilePage")
      .classList.add("hidden");

    $("adminPage")
      .classList.add("hidden");

    $("chatPage")
      .classList.add("hidden");

  }



  /* =====================================================
     AUTH MODE
  ===================================================== */

  function setAuthMode(mode) {

    authMode = mode;

    hideAuthMessage();


    if (mode === "signup") {

      $("nameField")
        .classList.remove("hidden");

      $("authButton")
        .textContent = "ثبت‌نام";

      $("switchAuthButton")
        .textContent =
        "قبلاً حساب داری؟ ورود";

      $("passwordInput")
        .setAttribute(
          "autocomplete",
          "new-password"
        );

    } else {

      $("nameField")
        .classList.add("hidden");

      $("authButton")
        .textContent = "ورود";

      $("switchAuthButton")
        .textContent =
        "حساب نداری؟ ثبت‌نام";

      $("passwordInput")
        .setAttribute(
          "autocomplete",
          "current-password"
        );

    }

  }


  $("switchAuthButton")
    .addEventListener(
      "click",
      () => {

        setAuthMode(
          authMode === "signup"
            ? "login"
            : "signup"
        );

      }
    );



  /* =====================================================
     LOGIN / SIGNUP
  ===================================================== */

  $("authButton")
    .addEventListener(
      "click",
      async () => {

        if (
          $("authButton").disabled
        ) {
          return;
        }


        hideAuthMessage();


        const email =
          $("emailInput")
            .value
            .trim();


        const password =
          $("passwordInput")
            .value;


        const name =
          $("nameInput")
            .value
            .trim();


        if (!email || !password) {

          showAuthMessage(
            "ایمیل و رمز عبور را وارد کن.",
            "error"
          );

          return;

        }


        $("authButton")
          .disabled = true;


        try {


          /* =========================================
             SIGN UP
          ========================================= */

          if (authMode === "signup") {


            if (!name) {

              showAuthMessage(
                "لطفاً نام نمایشی را وارد کن.",
                "error"
              );

              return;

            }


            if (password.length < 6) {

              showAuthMessage(
                "رمز عبور باید حداقل ۶ کاراکتر باشد.",
                "error"
              );

              return;

            }


            const {
              data,
              error
            } =
              await supabaseClient.auth.signUp({

                email,

                password,

                options: {

                  data: {
                    display_name: name
                  }

                }

              });


            if (error) {

              showAuthMessage(
                error.message,
                "error"
              );

              return;

            }


            /*
              پروفایل توسط Trigger دیتابیس ساخته می‌شود.
              اینجا دیگر از مرورگر insert نمی‌کنیم.
            */


            if (
              data?.session
            ) {

              await loadApp(
                data.user
              );

            } else {

              showAuthMessage(
                "ثبت‌نام انجام شد. اگر تأیید ایمیل فعال باشد، ایمیل خود را تأیید کن. بعد از تأیید، مدیر باید حساب تو را تأیید کند.",
                "success"
              );

              $("passwordInput")
                .value = "";

            }


            return;

          }



          /* =========================================
             LOGIN
          ========================================= */

          const {
            data,
            error
          } =
            await supabaseClient.auth
              .signInWithPassword({

                email,

                password

              });


          if (error) {

            showAuthMessage(
              error.message,
              "error"
            );

            return;

          }


          /*
            مهم:
            اینجا loadApp را دستی صدا نمی‌زنیم.

            onAuthStateChange فقط یک بار
            SIGNED_IN را دریافت می‌کند
            و loadApp را اجرا می‌کند.
          */


          showAuthMessage(
            "در حال ورود...",
            "success"
          );


        } catch (error) {

          console.error(error);

          showAuthMessage(
            "خطای غیرمنتظره رخ داد.",
            "error"
          );

        } finally {

          $("authButton")
            .disabled = false;

        }

      }
    );



  /* =====================================================
     LOAD APP
  ===================================================== */

  async function loadApp(user) {

    if (!user) {
      return;
    }


    /*
      جلوگیری از اجرای دوباره همزمان
    */

    if (isLoadingApp) {
      return;
    }


    isLoadingApp = true;


    try {


      currentUser = user;


      const {
        data: profile,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,display_name,avatar_url,created_at,updated_at,approved"
          )
          .eq(
            "id",
            user.id
          )
          .maybeSingle();


      if (error) {

        console.error(
          "PROFILE ERROR:",
          error
        );

        await supabaseClient.auth.signOut();

        currentUser = null;

        showAuth();

        showAuthMessage(
          "خطا در دریافت اطلاعات حساب.",
          "error"
        );

        return;

      }


      if (!profile) {

        await supabaseClient.auth.signOut();

        currentUser = null;

        showAuth();

        showAuthMessage(
          "پروفایل حساب پیدا نشد. لطفاً دوباره ثبت‌نام یا ورود کن.",
          "error"
        );

        return;

      }


      currentProfile = profile;


      /*
        حساب هنوز توسط مدیر تأیید نشده
      */

      if (
        profile.approved !== true
      ) {

        await supabaseClient.auth.signOut();

        currentUser = null;

        currentProfile = null;

        showAuth();

        showAuthMessage(
          "حساب شما ثبت شده، اما هنوز توسط مدیر تأیید نشده است.",
          "error"
        );

        return;

      }


      /* =========================================
         SHOW APP
      ========================================= */

      showApp();


      $("welcomeText")
        .textContent =
        "سلام " +
        (
          profile.display_name ||
          "دوست من"
        ) +
        " 👋";


      $("profileNameInput")
        .value =
        profile.display_name || "";


      renderProfileAvatar();


      await loadUsers();


      /*
        بررسی مدیر بودن از طریق Edge Function
      */

      await detectAdmin();


      /*
        بررسی دوره‌ای وضعیت تأیید
      */

      startApprovalWatcher();


    } finally {

      isLoadingApp = false;

    }

  }



  /* =====================================================
     USERS
  ===================================================== */

  async function loadUsers() {

    if (!currentUser) {
      return;
    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id,display_name,avatar_url,created_at"
        )
        .neq(
          "id",
          currentUser.id
        )
        .order(
          "display_name",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(error);

      $("usersList").innerHTML =
        `
        <div class="error-box">
          خطا در دریافت کاربران.
        </div>
        `;

      return;

    }


    allUsers = data || [];

    renderUsers(allUsers);

  }


  function renderUsers(users) {

    if (!users.length) {

      $("usersList").innerHTML =
        `
        <div class="page-card">
          هنوز کاربر دیگری وجود ندارد.
        </div>
        `;

      return;

    }


    $("usersList").innerHTML =
      users
        .map(user => {

          const name =
            user.display_name ||
            "کاربر";


          const avatar =
            user.avatar_url

              ? `
                <img
                  src="${escapeHtml(
                    user.avatar_url
                  )}"
                  alt=""
                >
              `

              : escapeHtml(
                  getInitial(name)
                );


          return `

            <div
              class="user-card"
              data-user-id="${escapeHtml(
                user.id
              )}"
            >

              <div class="avatar">
                ${avatar}
              </div>

              <div class="user-info">

                <div class="user-name">
                  ${escapeHtml(name)}
                </div>

                <div class="user-status">
                  آماده گفتگو
                </div>

              </div>

            </div>

          `;

        })
        .join("");


    document
      .querySelectorAll(".user-card")
      .forEach(card => {

        card.addEventListener(
          "click",
          () => {

            const user =
              allUsers.find(
                item =>
                  item.id ===
                  card.dataset.userId
              );


            if (user) {

              openChat(user);

            }

          }
        );

      });

  }


  $("searchInput")
    .addEventListener(
      "input",
      () => {

        const query =
          $("searchInput")
            .value
            .trim()
            .toLowerCase();


        if (!query) {

          renderUsers(
            allUsers
          );

          return;

        }


        const filtered =
          allUsers.filter(
            user =>
              String(
                user.display_name || ""
              )
              .toLowerCase()
              .includes(query)
          );


        renderUsers(filtered);

      }
    );



  /* =====================================================
     PROFILE
  ===================================================== */

  function renderProfileAvatar() {

    const name =
      currentProfile?.display_name ||
      "کاربر";


    if (
      currentProfile?.avatar_url
    ) {

      $("profileAvatar")
        .innerHTML =
        `
        <img
          src="${escapeHtml(
            currentProfile.avatar_url
          )}"
          alt=""
        >
        `;

    } else {

      $("profileAvatar")
        .textContent =
        getInitial(name);

    }

  }


  $("profileBtn")
    .addEventListener(
      "click",
      () => {

        $("appScreen")
          .classList.add("hidden");

        $("profilePage")
          .classList.remove("hidden");

        $("profileNameInput")
          .value =
          currentProfile?.display_name ||
          "";

        renderProfileAvatar();

      }
    );


  $("backProfileBtn")
    .addEventListener(
      "click",
      () => {

        $("profilePage")
          .classList.add("hidden");

        $("appScreen")
          .classList.remove("hidden");

      }
    );


  $("saveProfileBtn")
    .addEventListener(
      "click",
      async () => {

        if (!currentUser) {
          return;
        }


        const name =
          $("profileNameInput")
            .value
            .trim();


        if (!name) {

          alert(
            "نام نمایشی را وارد کن."
          );

          return;

        }


        const {
          error
        } =
          await supabaseClient
            .from("profiles")
            .update({
              display_name: name
            })
            .eq(
              "id",
              currentUser.id
            );


        if (error) {

          alert(
            "ذخیره نشد:\n" +
            error.message
          );

          return;

        }


        currentProfile.display_name =
          name;


        $("welcomeText")
          .textContent =
          "سلام " +
          name +
          " 👋";


        renderProfileAvatar();

        $("profilePage")
          .classList.add("hidden");

        $("appScreen")
          .classList.remove("hidden");


        await loadUsers();

      }
    );



  /* =====================================================
     CHAT
  ===================================================== */

  async function openChat(user) {

    currentChatUser = user;


    $("chatTitle")
      .textContent =
      user.display_name ||
      "کاربر";


    if (user.avatar_url) {

      $("chatAvatar")
        .innerHTML =
        `
        <img
          src="${escapeHtml(
            user.avatar_url
          )}"
          alt=""
        >
        `;

    } else {

      $("chatAvatar")
        .textContent =
        getInitial(
          user.display_name
        );

    }


    $("chatPage")
      .classList.remove("hidden");


    await loadMessages();

    subscribeToMessages();

  }


  $("backChatBtn")
    .addEventListener(
      "click",
      closeChat
    );


  function closeChat() {

    $("chatPage")
      .classList.add("hidden");


    currentChatUser = null;


    if (messageChannel) {

      supabaseClient
        .removeChannel(
          messageChannel
        );

      messageChannel = null;

    }

  }


  async function loadMessages() {

    if (
      !currentUser ||
      !currentChatUser
    ) {
      return;
    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("messages")
        .select(
          "id,sender_id,receiver_id,content,created_at"
        )
        .or(
          `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUser.id}),and(sender_id.eq.${currentChatUser.id},receiver_id.eq.${currentUser.id})`
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(error);

      $("messagesList").innerHTML =
        `
        <div class="error-box">
          امکان دریافت پیام‌ها وجود ندارد.
        </div>
        `;

      return;

    }


    renderMessages(
      data || []
    );

  }


  function renderMessages(messages) {

    $("messagesList")
      .innerHTML = "";


    messages.forEach(
      appendMessage
    );


    scrollMessagesToBottom();

  }


  function appendMessage(message) {

    const mine =
      message.sender_id ===
      currentUser.id;


    const row =
      document.createElement(
        "div"
      );


    row.className =
      "message-row " +
      (
        mine
          ? "mine"
          : "theirs"
      );


    const bubble =
      document.createElement(
        "div"
      );


    bubble.className =
      "message-bubble";


    bubble.textContent =
      message.content;


    row.appendChild(
      bubble
    );


    $("messagesList")
      .appendChild(row);

  }


  function scrollMessagesToBottom() {

    const box =
      $("messagesList");


    box.scrollTop =
      box.scrollHeight;

  }


  function subscribeToMessages() {

    if (
      !currentUser ||
      !currentChatUser
    ) {
      return;
    }


    if (messageChannel) {

      supabaseClient
        .removeChannel(
          messageChannel
        );

    }


    messageChannel =
      supabaseClient
        .channel(
          "messages-" +
          currentUser.id +
          "-" +
          currentChatUser.id
        )
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "messages"
          },
          payload => {

            const message =
              payload.new;


            const relevant =
              (
                message.sender_id ===
                currentUser.id &&
                message.receiver_id ===
                currentChatUser.id
              )
              ||
              (
                message.sender_id ===
                currentChatUser.id &&
                message.receiver_id ===
                currentUser.id
              );


            if (relevant) {

              appendMessage(
                message
              );

              scrollMessagesToBottom();

            }

          }
        )
        .subscribe();

  }


  async function sendMessage() {

    if (
      !currentUser ||
      !currentChatUser
    ) {
      return;
    }


    const input =
      $("messageInput");


    const content =
      input.value.trim();


    if (!content) {
      return;
    }


    input.value = "";


    const {
      error
    } =
      await supabaseClient
        .from("messages")
        .insert({

          sender_id:
            currentUser.id,

          receiver_id:
            currentChatUser.id,

          content

        });


    if (error) {

      console.error(error);

      alert(
        "پیام ارسال نشد:\n" +
        error.message
      );

      input.value =
        content;

    }

  }


  $("sendMessageBtn")
    .addEventListener(
      "click",
      sendMessage
    );


  $("messageInput")
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );



  /* =====================================================
     ADMIN REQUEST
  ===================================================== */

  async function adminRequest(body) {

    const {
      data,
      error
    } =
      await supabaseClient
        .functions
        .invoke(
          "admin-panel",
          {
            body
          }
        );


    if (error) {

      throw error;

    }


    return data;

  }



  /* =====================================================
     DETECT ADMIN
  ===================================================== */

  async function detectAdmin() {

    isAdmin = false;


    $("adminBtn")
      .classList.add("hidden");


    try {

      await adminRequest({
        action: "list"
      });


      /*
        اگر سرور اجازه داد،
        این کاربر مدیر است.
      */

      isAdmin = true;


      $("adminBtn")
        .classList.remove("hidden");


    } catch (error) {

      /*
        کاربر عادی اینجا 403 می‌گیرد.
      */

      isAdmin = false;


      $("adminBtn")
        .classList.add("hidden");


      console.log(
        "Normal user:",
        error.message
      );

    }

  }



  /* =====================================================
     OPEN ADMIN
  ===================================================== */

  $("adminBtn")
    .addEventListener(
      "click",
      async () => {

        if (!isAdmin) {
          return;
        }


        $("appScreen")
          .classList.add("hidden");


        $("adminPage")
          .classList.remove("hidden");


        await loadAdminPanel();

      }
    );


  $("closeAdminBtn")
    .addEventListener(
      "click",
      () => {

        $("adminPage")
          .classList.add("hidden");


        $("appScreen")
          .classList.remove("hidden");

      }
    );


  $("refreshAdminBtn")
    .addEventListener(
      "click",
      loadAdminPanel
    );



  /* =====================================================
     LOAD ADMIN PANEL
  ===================================================== */

  async function loadAdminPanel() {

    $("adminUsersList")
      .innerHTML =
      `
      <div class="loading">
        در حال دریافت اطلاعات...
      </div>
      `;


    try {

      const result =
        await adminRequest({
          action: "list"
        });


      isAdmin = true;


      const stats =
        result.stats || {};


      $("adminStats")
        .innerHTML = `

          <div class="stat-card">

            <div class="stat-number">
              ${stats.total_users ?? 0}
            </div>

            <div class="stat-label">
              کل کاربران
            </div>

          </div>


          <div class="stat-card">

            <div class="stat-number">
              ${stats.approved_users ?? 0}
            </div>

            <div class="stat-label">
              تأیید شده
            </div>

          </div>


          <div class="stat-card">

            <div class="stat-number">
              ${stats.pending_users ?? 0}
            </div>

            <div class="stat-label">
              در انتظار
            </div>

          </div>


          <div class="stat-card">

            <div class="stat-number">
              ${stats.total_messages ?? 0}
            </div>

            <div class="stat-label">
              کل پیام‌ها
            </div>

          </div>

        `;


      renderAdminUsers(
        result.users || []
      );


    } catch (error) {

      console.error(
        "ADMIN ERROR:",
        error
      );


      isAdmin = false;


      $("adminBtn")
        .classList.add("hidden");


      $("adminUsersList")
        .innerHTML =
        `
        <div class="error-box">
          دسترسی به پنل مدیریت وجود ندارد.
        </div>
        `;

    }

  }



  /* =====================================================
     RENDER ADMIN USERS
  ===================================================== */

  function renderAdminUsers(users) {

    if (!users.length) {

      $("adminUsersList")
        .innerHTML =
        `
        <div class="page-card">
          هنوز کاربری وجود ندارد.
        </div>
        `;

      return;

    }


    $("adminUsersList")
      .innerHTML =
      users
        .map(user => {

          const isMe =
            user.id ===
            currentUser.id;


          const name =
            user.display_name ||
            "کاربر";


          const avatar =
            user.avatar_url

              ? `
                <img
                  src="${escapeHtml(
                    user.avatar_url
                  )}"
                  alt=""
                >
              `

              : escapeHtml(
                  getInitial(name)
                );


          let action;


          if (isMe) {

            action =
              `
              <span class="admin-badge">
                مدیر
              </span>
              `;

          } else {

            action =
              `
              <button
                class="
                  approval-btn
                  ${
                    user.approved
                      ? "approval-on"
                      : "approval-off"
                  }
                "
                data-user-id="${escapeHtml(
                  user.id
                )}"
                data-approved="${
                  user.approved
                    ? "true"
                    : "false"
                }"
              >
                ${
                  user.approved
                    ? "فعال ✓"
                    : "تأیید نشده"
                }
              </button>
              `;

          }


          return `

            <div class="admin-user">

              <div class="avatar">
                ${avatar}
              </div>


              <div class="admin-user-info">

                <div class="admin-user-name">
                  ${escapeHtml(name)}
                </div>

                <div class="admin-user-date">
                  عضویت:
                  ${formatDate(
                    user.created_at
                  )}
                </div>

                <div class="admin-user-date">
                  پیام‌ها:
                  ${
                    user.message_count ??
                    0
                  }
                </div>

              </div>


              ${action}

            </div>

          `;

        })
        .join("");


    document
      .querySelectorAll(
        "[data-user-id]"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          async () => {

            const userId =
              button.dataset.userId;


            const oldApproved =
              button.dataset.approved ===
              "true";


            const newApproved =
              !oldApproved;


            const question =
              newApproved

                ? "اجازه ورود این کاربر فعال شود؟"

                : "اجازه ورود این کاربر لغو شود؟";


            if (
              !confirm(question)
            ) {
              return;
            }


            button.disabled = true;


            try {

              await adminRequest({

                action:
                  "set_approval",

                target_user_id:
                  userId,

                approved:
                  newApproved

              });


              await loadAdminPanel();


            } catch (error) {

              console.error(
                "APPROVAL ERROR:",
                error
              );


              alert(
                "تغییر وضعیت انجام نشد:\n" +
                error.message
              );


              button.disabled =
                false;

            }

          }
        );

      });

  }



  /* =====================================================
     APPROVAL WATCHER
  ===================================================== */

  function startApprovalWatcher() {

    if (approvalTimer) {

      clearInterval(
        approvalTimer
      );

    }


    approvalTimer =
      setInterval(
        checkApproval,
        30000
      );

  }


  async function checkApproval() {

    if (!currentUser) {
      return;
    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select("approved")
        .eq(
          "id",
          currentUser.id
        )
        .maybeSingle();


    if (error || !data) {
      return;
    }


    if (
      data.approved !== true
    ) {

      await forceLogout(
        "اجازه ورود حساب شما توسط مدیر لغو شده است."
      );

    }

  }



  /* =====================================================
     FORCE LOGOUT
  ===================================================== */

  async function forceLogout(message) {

    if (approvalTimer) {

      clearInterval(
        approvalTimer
      );

      approvalTimer = null;

    }


    if (messageChannel) {

      await supabaseClient
        .removeChannel(
          messageChannel
        );

      messageChannel = null;

    }


    await supabaseClient.auth
      .signOut();


    currentUser = null;

    currentProfile = null;

    currentChatUser = null;

    allUsers = [];

    isAdmin = false;


    showAuth();


    showAuthMessage(
      message,
      "error"
    );

  }



  /* =====================================================
     LOGOUT
  ===================================================== */

  $("logoutBtn")
    .addEventListener(
      "click",
      async () => {

        await forceLogout(
          "از حساب خارج شدید."
        );

        hideAuthMessage();

      }
    );



  /* =====================================================
     AUTH STATE CHANGE
  ===================================================== */

  supabaseClient.auth
    .onAuthStateChange(
      async (
        event,
        session
      ) => {

        /*
          فقط SIGNED_IN اینجا loadApp را اجرا می‌کند.

          INITIAL_SESSION در init مدیریت می‌شود.
          بنابراین ورود دوبار اجرا نمی‌شود.
        */

        if (
          event === "SIGNED_IN" &&
          session?.user
        ) {

          await loadApp(
            session.user
          );

        }

      }
    );



  /* =====================================================
     PWA
  ===================================================== */

  if (
    "serviceWorker" in navigator
  ) {

    window.addEventListener(
      "load",
      () => {

        navigator.serviceWorker
          .register(
            "./service-worker.js"
          )
          .catch(
            console.error
          );

      }
    );

  }



  /* =====================================================
     INITIAL LOAD
  ===================================================== */

  async function init() {

    setAuthMode(
      "signup"
    );


    const {
      data,
      error
    } =
      await supabaseClient.auth
        .getSession();


    if (error) {

      console.error(
        "SESSION ERROR:",
        error
      );

      showAuth();

      return;

    }


    if (
      data?.session?.user
    ) {

      /*
        INITIAL_SESSION را اینجا
        مدیریت می‌کنیم.
      */

      await loadApp(
        data.session.user
      );

    } else {

      showAuth();

    }

  }


  init();

</script>
