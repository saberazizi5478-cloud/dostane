<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>دوستانه</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="دوستانه">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    body {
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       AUTH
    ========================= */

    #authPage {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at top right, #dbeafe 0%, transparent 35%),
        radial-gradient(circle at bottom left, #e0e7ff 0%, transparent 35%),
        #f4f7fb;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,.96);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 50px rgba(0,0,0,.10);
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 22px;
      background: linear-gradient(135deg,#2563eb,#7c3aed);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: bold;
      box-shadow: 0 12px 25px rgba(37,99,235,.25);
    }

    .auth-title {
      text-align: center;
      margin: 0;
      font-size: 27px;
    }

    .auth-subtitle {
      text-align: center;
      color: #667085;
      margin: 8px 0 25px;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      color: #475467;
    }

    .input,
    .textarea {
      width: 100%;
      border: 1px solid #d8dee9;
      border-radius: 14px;
      padding: 13px 14px;
      outline: none;
      background: #fff;
      font-size: 15px;
      transition: .2s;
    }

    .input:focus,
    .textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.10);
    }

    .primary-btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      margin-top: 5px;
    }

    .primary-btn:active {
      transform: scale(.99);
    }

    .secondary-btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 13px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 14px;
      margin-top: 10px;
    }

    .text-btn {
      border: none;
      background: transparent;
      color: #2563eb;
      font-size: 13px;
      padding: 10px 0;
    }

    .auth-message {
      margin-top: 15px;
      padding: 11px;
      border-radius: 12px;
      font-size: 13px;
      display: none;
    }

    .auth-message.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
    }

    .auth-message.success {
      display: block;
      background: #f0fdf4;
      color: #15803d;
    }

    /* =========================
       APP
    ========================= */

    #appPage {
      width: 100%;
      height: 100%;
      background: #f4f7fb;
    }

    .app {
      width: 100%;
      height: 100%;
      max-width: 1100px;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 66px;
      flex-shrink: 0;
      background: white;
      border-bottom: 1px solid #e7eaf0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      font-size: 19px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg,#2563eb,#7c3aed);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: none;
      background: #f3f5f9;
      border-radius: 12px;
      font-size: 18px;
    }

    .content {
      flex: 1;
      min-height: 0;
      position: relative;
    }

    .page {
      width: 100%;
      height: 100%;
      overflow-y: auto;
    }

    /* =========================
       HOME
    ========================= */

    .home-header {
      padding: 20px 16px 10px;
    }

    .welcome {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .muted {
      color: #667085;
      font-size: 13px;
    }

    .search-box {
      padding: 10px 16px;
    }

    .search-input {
      width: 100%;
      border: none;
      outline: none;
      background: white;
      border-radius: 15px;
      padding: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,.04);
      font-size: 14px;
    }

    .section-title {
      padding: 12px 16px 8px;
      font-size: 14px;
      font-weight: bold;
      color: #475467;
    }

    .users-list {
      padding: 0 10px 20px;
    }

    .user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 9px;
      border-radius: 16px;
      background: white;
      margin-bottom: 8px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(0,0,0,.025);
    }

    .user-item:active {
      transform: scale(.995);
    }

    .avatar {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border-radius: 50%;
      background: linear-gradient(135deg,#dbeafe,#ddd6fe);
      color: #3730a3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 5px;
    }

    .user-email {
      color: #98a2b3;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: #98a2b3;
    }

    /* =========================
       PROFILE
    ========================= */

    .profile-page {
      padding: 25px 16px;
    }

    .profile-card {
      background: white;
      border-radius: 22px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 3px 20px rgba(0,0,0,.05);
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: linear-gradient(135deg,#2563eb,#7c3aed);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      font-weight: bold;
    }

    .profile-name {
      font-size: 20px;
      font-weight: bold;
    }

    .profile-email {
      color: #667085;
      margin-top: 6px;
      font-size: 13px;
    }

    /* =========================
       CHAT
    ========================= */

    #chatPage {
      position: absolute;
      inset: 0;
      background: #eef2f7;
      display: flex;
      flex-direction: column;
      z-index: 20;
    }

    .chat-header {
      height: 64px;
      flex-shrink: 0;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border: none;
      background: #f3f4f6;
      border-radius: 12px;
      font-size: 20px;
    }

    .chat-user {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .chat-user .avatar {
      width: 42px;
      height: 42px;
    }

    .chat-user-info {
      min-width: 0;
    }

    .chat-user-name {
      font-weight: bold;
      font-size: 15px;
    }

    .chat-status {
      font-size: 11px;
      color: #98a2b3;
      margin-top: 3px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.mine {
      justify-content: flex-start;
    }

    .message-row.theirs {
      justify-content: flex-end;
    }

    .message-bubble {
      max-width: 78%;
      padding: 10px 13px;
      border-radius: 17px;
      font-size: 14px;
      line-height: 1.7;
      word-break: break-word;
      white-space: pre-wrap;
      position: relative;
    }

    .mine .message-bubble {
      background: #2563eb;
      color: white;
      border-bottom-left-radius: 5px;
    }

    .theirs .message-bubble {
      background: white;
      color: #172033;
      border-bottom-right-radius: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }

    .message-time {
      font-size: 9px;
      opacity: .7;
      margin-top: 3px;
      text-align: left;
    }

    .chat-input-area {
      flex-shrink: 0;
      background: white;
      border-top: 1px solid #e5e7eb;
      padding: 9px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .message-input {
      flex: 1;
      max-height: 110px;
      min-height: 43px;
      resize: none;
      border: none;
      outline: none;
      background: #f3f4f6;
      border-radius: 16px;
      padding: 11px 13px;
      font-size: 14px;
      line-height: 1.5;
    }

    .send-btn {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 19px;
    }

    .send-btn:disabled {
      opacity: .5;
    }

    /* =========================
       LOADING
    ========================= */

    #loading {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,.95);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }

    .loader {
      width: 38px;
      height: 38px;
      border: 4px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 800px) {
      .app {
        box-shadow: 0 0 40px rgba(0,0,0,.06);
        background: #f4f7fb;
      }

      .users-list {
        max-width: 700px;
        margin: auto;
      }

      .home-header,
      .search-box,
      .section-title {
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
      }
    }
  </style>
</head>

<body>

<!-- =========================
     LOADING
========================= -->

<div id="loading">
  <div class="loader"></div>
  <div>در حال آماده‌سازی دوستانه...</div>
</div>


<!-- =========================
     AUTH PAGE
========================= -->

<div id="authPage" class="hidden">

  <div class="auth-card">

    <div class="logo">د</div>

    <h1 class="auth-title">دوستانه</h1>

    <div class="auth-subtitle">
      یک جای ساده برای گفتگو با دوستان
    </div>


    <!-- LOGIN -->

    <div id="loginForm">

      <div class="input-group">
        <label>ایمیل</label>
        <input
          id="loginEmail"
          class="input"
          type="email"
          placeholder="ایمیل خود را وارد کنید"
          autocomplete="email"
        >
      </div>

      <div class="input-group">
        <label>رمز عبور</label>
        <input
          id="loginPassword"
          class="input"
          type="password"
          placeholder="رمز عبور"
          autocomplete="current-password"
        >
      </div>

      <button class="primary-btn" onclick="login()">
        ورود
      </button>

      <button class="text-btn" onclick="showSignup()">
        حساب ندارم؛ ثبت‌نام می‌کنم
      </button>

      <br>

      <button class="text-btn" onclick="showForgotPassword()">
        رمز عبورم را فراموش کرده‌ام
      </button>

    </div>


    <!-- SIGNUP -->

    <div id="signupForm" class="hidden">

      <div class="input-group">
        <label>نام شما</label>
        <input
          id="signupName"
          class="input"
          type="text"
          placeholder="مثلاً صابر"
          autocomplete="name"
        >
      </div>

      <div class="input-group">
        <label>ایمیل</label>
        <input
          id="signupEmail"
          class="input"
          type="email"
          placeholder="ایمیل"
          autocomplete="email"
        >
      </div>

      <div class="input-group">
        <label>رمز عبور</label>
        <input
          id="signupPassword"
          class="input"
          type="password"
          placeholder="حداقل ۶ کاراکتر"
          autocomplete="new-password"
        >
      </div>

      <button class="primary-btn" onclick="signup()">
        ساخت حساب
      </button>

      <button class="text-btn" onclick="showLogin()">
        قبلاً حساب دارم
      </button>

    </div>


    <!-- FORGOT PASSWORD -->

    <div id="forgotForm" class="hidden">

      <div class="input-group">
        <label>ایمیل حساب</label>
        <input
          id="forgotEmail"
          class="input"
          type="email"
          placeholder="ایمیل"
        >
      </div>

      <button class="primary-btn" onclick="forgotPassword()">
        ارسال لینک بازیابی
      </button>

      <button class="text-btn" onclick="showLogin()">
        برگشت به ورود
      </button>

    </div>


    <!-- RESET PASSWORD -->

    <div id="resetForm" class="hidden">

      <div class="input-group">
        <label>رمز عبور جدید</label>
        <input
          id="newPassword"
          class="input"
          type="password"
          placeholder="رمز عبور جدید"
        >
      </div>

      <button class="primary-btn" onclick="updatePassword()">
        ذخیره رمز جدید
      </button>

    </div>


    <div id="authMessage" class="auth-message"></div>

  </div>

</div>


<!-- =========================
     APP PAGE
========================= -->

<div id="appPage" class="hidden">

  <div class="app">

    <div class="topbar">

      <div class="brand">
        <div class="brand-icon">د</div>
        <span>دوستانه</span>
      </div>

      <div class="top-actions">

        <button
          class="icon-btn"
          onclick="showProfile()"
          title="پروفایل"
        >
          👤
        </button>

        <button
          class="icon-btn"
          onclick="logout()"
          title="خروج"
        >
          ⎋
        </button>

      </div>

    </div>


    <div class="content">


      <!-- HOME -->

      <div id="homePage" class="page">

        <div class="home-header">

          <div id="welcomeText" class="welcome">
            سلام 👋
          </div>

          <div class="muted">
            دوستانت رو پیدا کن و گفتگو رو شروع کن
          </div>

        </div>


        <div class="search-box">

          <input
            id="searchInput"
            class="search-input"
            type="text"
            placeholder="جستجوی کاربران..."
            oninput="searchUsers()"
          >

        </div>


        <div class="section-title">
          کاربران
        </div>


        <div id="usersList" class="users-list">

          <div class="empty-state">
            در حال بارگذاری کاربران...
          </div>

        </div>

      </div>


      <!-- PROFILE -->

      <div id="profilePage" class="page hidden">

        <div class="profile-page">

          <div class="profile-card">

            <div id="profileAvatar" class="profile-avatar">
              د
            </div>

            <div id="profileName" class="profile-name">
              -
            </div>

            <div id="profileEmail" class="profile-email">
              -
            </div>

            <br>

            <button
              class="secondary-btn"
              onclick="showHome()"
            >
              برگشت به صفحه اصلی
            </button>

          </div>

        </div>

      </div>


      <!-- CHAT -->

      <div id="chatPage" class="hidden">

        <div class="chat-header">

          <button
            class="back-btn"
            onclick="closeChat()"
          >
            → 
          </button>


          <div class="chat-user">

            <div id="chatAvatar" class="avatar">
              د
            </div>

            <div class="chat-user-info">

              <div id="chatUserName" class="chat-user-name">
                -
              </div>

              <div class="chat-status">
                گفتگو
              </div>

            </div>

          </div>

        </div>


        <div id="messages" class="messages">

          <div class="empty-state">
            هنوز پیامی وجود ندارد
          </div>

        </div>


        <div class="chat-input-area">

          <textarea
            id="messageInput"
            class="message-input"
            placeholder="پیامت رو بنویس..."
            rows="1"
            onkeydown="handleMessageKey(event)"
          ></textarea>

          <button
            id="sendButton"
            class="send-btn"
            onclick="sendMessage()"
          >
            ➤
          </button>

        </div>

      </div>


    </div>

  </div>

</div>


<script>

  /* =========================================================
     SUPABASE
  ========================================================= */

  const SUPABASE_URL =
    "https://uobviepglysngosuomph.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_ki1URRpDpSc-E5h5HQiq3w_2_-LHIHa";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================================
     GLOBAL STATE
  ========================================================= */

  let currentUser = null;
  let currentProfile = null;

  let allUsers = [];

  let selectedUser = null;

  let messagesChannel = null;


  /* =========================================================
     HELPERS
  ========================================================= */

  function $(id) {
    return document.getElementById(id);
  }


  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function getInitial(name) {

    const text =
      String(name || "د").trim();

    return text.charAt(0) || "د";
  }


  function formatTime(dateString) {

    const date =
      new Date(dateString);

    return date.toLocaleTimeString(
      "fa-IR",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  }


  function showAuthMessage(message, type = "error") {

    const box = $("authMessage");

    box.textContent = message;

    box.className =
      "auth-message " + type;

  }


  function clearAuthMessage() {

    const box = $("authMessage");

    box.textContent = "";

    box.className = "auth-message";

  }


  /* =========================================================
     AUTH FORMS
  ========================================================= */

  function hideAllAuthForms() {

    $("loginForm").classList.add("hidden");
    $("signupForm").classList.add("hidden");
    $("forgotForm").classList.add("hidden");
    $("resetForm").classList.add("hidden");

    clearAuthMessage();
  }


  function showLogin() {

    hideAllAuthForms();

    $("loginForm").classList.remove("hidden");
  }


  function showSignup() {

    hideAllAuthForms();

    $("signupForm").classList.remove("hidden");
  }


  function showForgotPassword() {

    hideAllAuthForms();

    $("forgotForm").classList.remove("hidden");
  }


  function showResetPassword() {

    hideAllAuthForms();

    $("resetForm").classList.remove("hidden");
  }


  /* =========================================================
     CREATE PROFILE
  ========================================================= */

  async function createProfile(user, displayName) {

    const name =
      String(displayName || "")
        .trim();

    const { error } =
      await supabaseClient
        .from("profiles")
        .upsert(
          {
            id: user.id,
            display_name: name,
            email: user.email || ""
          },
          {
            onConflict: "id"
          }
        );

    if (error) {
      console.error(
        "PROFILE ERROR:",
        error
      );
    }

  }


  /* =========================================================
     SIGN UP
  ========================================================= */

  async function signup() {

    clearAuthMessage();

    const name =
      $("signupName").value.trim();

    const email =
      $("signupEmail").value.trim();

    const password =
      $("signupPassword").value;

    if (!name) {
      showAuthMessage(
        "لطفاً نامت رو وارد کن."
      );
      return;
    }

    if (!email) {
      showAuthMessage(
        "لطفاً ایمیل رو وارد کن."
      );
      return;
    }

    if (password.length < 6) {
      showAuthMessage(
        "رمز عبور باید حداقل ۶ کاراکتر باشه."
      );
      return;
    }


    const { data, error } =
      await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: {
            display_name: name
          }
        }
      });


    if (error) {

      console.error(error);

      showAuthMessage(
        error.message
      );

      return;
    }


    if (data.user) {

      await createProfile(
        data.user,
        name
      );

    }


    showAuthMessage(
      "حساب با موفقیت ساخته شد.",
      "success"
    );


    if (data.session) {

      await loadApp();

    } else {

      showAuthMessage(
        "حساب ساخته شد. اگر تأیید ایمیل فعال است، ایمیلت رو تأیید کن و بعد وارد شو.",
        "success"
      );

      showLogin();

    }

  }


  /* =========================================================
     LOGIN
  ========================================================= */

  async function login() {

    clearAuthMessage();

    const email =
      $("loginEmail").value.trim();

    const password =
      $("loginPassword").value;


    if (!email || !password) {

      showAuthMessage(
        "ایمیل و رمز عبور رو وارد کن."
      );

      return;
    }


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });


    if (error) {

      console.error(error);

      showAuthMessage(
        error.message
      );

      return;
    }


    currentUser =
      data.user;


    await loadApp();

  }


  /* =========================================================
     FORGOT PASSWORD
  ========================================================= */

  async function forgotPassword() {

    clearAuthMessage();

    const email =
      $("forgotEmail").value.trim();


    if (!email) {

      showAuthMessage(
        "ایمیل رو وارد کن."
      );

      return;
    }


    const redirectTo =
      window.location.origin +
      window.location.pathname;


    const { error } =
      await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo
        }
      );


    if (error) {

      showAuthMessage(
        error.message
      );

      return;
    }


    showAuthMessage(
      "لینک بازیابی رمز عبور به ایمیلت ارسال شد.",
      "success"
    );

  }


  /* =========================================================
     UPDATE PASSWORD
  ========================================================= */

  async function updatePassword() {

    const password =
      $("newPassword").value;


    if (password.length < 6) {

      showAuthMessage(
        "رمز عبور باید حداقل ۶ کاراکتر باشه."
      );

      return;
    }


    const { error } =
      await supabaseClient.auth.updateUser({
        password
      });


    if (error) {

      showAuthMessage(
        error.message
      );

      return;
    }


    showAuthMessage(
      "رمز عبور با موفقیت تغییر کرد.",
      "success"
    );


    setTimeout(
      () => showLogin(),
      1500
    );

  }


  /* =========================================================
     LOAD APP
  ========================================================= */

  async function loadApp() {

    const {
      data: {
        user
      }
    } =
      await supabaseClient.auth.getUser();


    if (!user) {

      showAuthPage();

      return;
    }


    currentUser =
      user;


    await createProfile(
      user,
      user.user_metadata?.display_name || ""
    );


    const {
      data: profile,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .maybeSingle();


    if (error) {

      console.error(
        "PROFILE LOAD ERROR:",
        error
      );

    }


    currentProfile =
      profile || {
        id: user.id,
        display_name:
          user.user_metadata?.display_name ||
          "کاربر",
        email:
          user.email || ""
      };


    $("welcomeText").textContent =
      "سلام " +
      (
        currentProfile.display_name ||
        "دوست من"
      ) +
      " 👋";


    $("authPage").classList.add("hidden");

    $("appPage").classList.remove("hidden");


    showHome();

    await loadUsers();

  }


  /* =========================================================
     AUTH PAGE
  ========================================================= */

  function showAuthPage() {

    $("appPage").classList.add("hidden");

    $("authPage").classList.remove("hidden");

  }


  /* =========================================================
     LOAD USERS
  ========================================================= */

  async function loadUsers() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id,display_name,email,avatar_url,created_at"
        )
        .neq(
          "id",
          currentUser.id
        )
        .order(
          "display_name",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(
        "USERS LOAD ERROR:",
        error
      );

      $("usersList").innerHTML =
        `
        <div class="empty-state">
          خطا در دریافت کاربران
        </div>
        `;

      return;
    }


    allUsers =
      data || [];


    renderUsers(
      allUsers
    );

  }


  /* =========================================================
     RENDER USERS
  ========================================================= */

  function renderUsers(users) {

    const list =
      $("usersList");


    if (!users.length) {

      list.innerHTML =
        `
        <div class="empty-state">
          کاربر دیگری پیدا نشد.
        </div>
        `;

      return;
    }


    list.innerHTML =
      users
        .map(user => {

          const name =
            user.display_name ||
            "کاربر";


          const avatar =
            user.avatar_url
              ?
              `
              <img
                src="${escapeHtml(user.avatar_url)}"
                alt=""
              >
              `
              :
              escapeHtml(
                getInitial(name)
              );


          return `
            <div
              class="user-item"
              onclick="openChat('${user.id}')"
            >

              <div class="avatar">
                ${avatar}
              </div>

              <div class="user-info">

                <div class="user-name">
                  ${escapeHtml(name)}
                </div>

                <div class="user-email">
                  ${escapeHtml(user.email || "")}
                </div>

              </div>

            </div>
          `;

        })
        .join("");

  }


  /* =========================================================
     SEARCH USERS
  ========================================================= */

  function searchUsers() {

    const value =
      $("searchInput")
        .value
        .trim()
        .toLowerCase();


    if (!value) {

      renderUsers(
        allUsers
      );

      return;
    }


    const filtered =
      allUsers.filter(user => {

        const name =
          String(
            user.display_name || ""
          ).toLowerCase();

        const email =
          String(
            user.email || ""
          ).toLowerCase();


        return (
          name.includes(value) ||
          email.includes(value)
        );

      });


    renderUsers(
      filtered
    );

  }


  /* =========================================================
     HOME
  ========================================================= */

  function showHome() {

    stopMessagesRealtime();

    $("homePage")
      .classList
      .remove("hidden");

    $("profilePage")
      .classList
      .add("hidden");

    $("chatPage")
      .classList
      .add("hidden");

  }


  /* =========================================================
     PROFILE
  ========================================================= */

  function showProfile() {

    stopMessagesRealtime();


    $("homePage")
      .classList
      .add("hidden");

    $("chatPage")
      .classList
      .add("hidden");

    $("profilePage")
      .classList
      .remove("hidden");


    const name =
      currentProfile?.display_name ||
      "کاربر";


    $("profileName").textContent =
      name;


    $("profileEmail").textContent =
      currentProfile?.email ||
      currentUser?.email ||
      "";


    $("profileAvatar").textContent =
      getInitial(name);

  }


  /* =========================================================
     OPEN CHAT
  ========================================================= */

  async function openChat(userId) {

    const user =
      allUsers.find(
        item => item.id === userId
      );


    if (!user) {
      return;
    }


    selectedUser =
      user;


    $("homePage")
      .classList
      .add("hidden");

    $("profilePage")
      .classList
      .add("hidden");

    $("chatPage")
      .classList
      .remove("hidden");


    const name =
      user.display_name ||
      "کاربر";


    $("chatUserName").textContent =
      name;


    if (user.avatar_url) {

      $("chatAvatar").innerHTML =
        `
        <img
          src="${escapeHtml(user.avatar_url)}"
          alt=""
        >
        `;

    } else {

      $("chatAvatar").textContent =
        getInitial(name);

    }


    $("messages").innerHTML = "";


    await loadMessages();


    startMessagesRealtime();

  }


  /* =========================================================
     CLOSE CHAT
  ========================================================= */

  function closeChat() {

    stopMessagesRealtime();

    selectedUser =
      null;

    $("chatPage")
      .classList
      .add("hidden");

    $("homePage")
      .classList
      .remove("hidden");

  }


  /* =========================================================
     LOAD MESSAGES
  ========================================================= */

  async function loadMessages() {

    if (!currentUser || !selectedUser) {
      return;
    }


    const myId =
      currentUser.id;

    const otherId =
      selectedUser.id;


    const {
      data,
      error
    } =
      await supabaseClient
        .from("messages")
        .select(
          "id,sender_id,receiver_id,content,created_at"
        )
        .or(
          `and(sender_id.eq.${myId},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${myId})`
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(
        "MESSAGES LOAD ERROR:",
        error
      );

      $("messages").innerHTML =
        `
        <div class="empty-state">
          خطا در دریافت پیام‌ها
        </div>
        `;

      return;
    }


    const messages =
      data || [];


    if (!messages.length) {

      $("messages").innerHTML =
        `
        <div class="empty-state">
          هنوز پیامی وجود ندارد.<br>
          اولین پیام رو بفرست 👋
        </div>
        `;

    } else {

      $("messages").innerHTML = "";

      messages.forEach(
        addMessageToScreen
      );

    }


    scrollMessagesToBottom();

  }


  /* =========================================================
     ADD MESSAGE TO SCREEN
  ========================================================= */

  function addMessageToScreen(message) {

    if (!message) {
      return;
    }


    const messagesBox =
      $("messages");


    if (!messagesBox) {
      return;
    }


    if (
      messagesBox.querySelector(
        `[data-message-id="${message.id}"]`
      )
    ) {
      return;
    }


    const empty =
      messagesBox.querySelector(
        ".empty-state"
      );


    if (empty) {
      empty.remove();
    }


    const mine =
      message.sender_id ===
      currentUser.id;


    const row =
      document.createElement("div");


    row.className =
      "message-row " +
      (
        mine
          ? "mine"
          : "theirs"
      );


    row.dataset.messageId =
      message.id;


    const bubble =
      document.createElement("div");


    bubble.className =
      "message-bubble";


    const content =
      document.createElement("div");


    content.textContent =
      message.content;


    const time =
      document.createElement("div");


    time.className =
      "message-time";


    time.textContent =
      formatTime(
        message.created_at
      );


    bubble.appendChild(
      content
    );

    bubble.appendChild(
      time
    );

    row.appendChild(
      bubble
    );

    messagesBox.appendChild(
      row
    );


    scrollMessagesToBottom();

  }


  /* =========================================================
     SCROLL
  ========================================================= */

  function scrollMessagesToBottom() {

    const box =
      $("messages");


    if (!box) {
      return;
    }


    setTimeout(() => {

      box.scrollTop =
        box.scrollHeight;

    }, 30);

  }


  /* =========================================================
     SEND MESSAGE
  ========================================================= */

  async function sendMessage() {

    if (
      !currentUser ||
      !selectedUser
    ) {
      return;
    }


    const input =
      $("messageInput");


    const content =
      input.value.trim();


    if (!content) {
      return;
    }


    const button =
      $("sendButton");


    button.disabled =
      true;


    const {
      data,
      error
    } =
      await supabaseClient
        .from("messages")
        .insert({
          sender_id:
            currentUser.id,

          receiver_id:
            selectedUser.id,

          content:
            content
        })
        .select(
          "id,sender_id,receiver_id,content,created_at"
        )
        .single();


    button.disabled =
      false;


    if (error) {

      console.error(
        "SEND MESSAGE ERROR:",
        error
      );

      alert(
        "ارسال پیام انجام نشد."
      );

      return;
    }


    input.value =
      "";

    input.style.height =
      "43px";


    addMessageToScreen(
      data
    );

  }


  /* =========================================================
     ENTER KEY
  ========================================================= */

  function handleMessageKey(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }


  /* =========================================================
     REALTIME
  ========================================================= */

  function startMessagesRealtime() {

    stopMessagesRealtime();


    if (
      !currentUser ||
      !selectedUser
    ) {
      return;
    }


    const myId =
      currentUser.id;

    const otherId =
      selectedUser.id;


    messagesChannel =
      supabaseClient
        .channel(
          "messages-" +
          myId +
          "-" +
          otherId +
          "-" +
          Date.now()
        )
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "messages"
          },
          payload => {

            const message =
              payload.new;


            const belongsToChat =
              (
                message.sender_id === myId &&
                message.receiver_id === otherId
              )
              ||
              (
                message.sender_id === otherId &&
                message.receiver_id === myId
              );


            if (!belongsToChat) {
              return;
            }


            addMessageToScreen(
              message
            );

          }
        )
        .subscribe(
          (status, error) => {

            console.log(
              "REALTIME STATUS:",
              status,
              error || ""
            );

          }
        );

  }


  function stopMessagesRealtime() {

    if (!messagesChannel) {
      return;
    }


    supabaseClient
      .removeChannel(
        messagesChannel
      );


    messagesChannel =
      null;

  }


  /* =========================================================
     LOGOUT
  ========================================================= */

  async function logout() {

    stopMessagesRealtime();


    await supabaseClient.auth.signOut();


    currentUser =
      null;

    currentProfile =
      null;

    selectedUser =
      null;


    $("appPage")
      .classList
      .add("hidden");


    $("authPage")
      .classList
      .remove("hidden");


    showLogin();

  }


  /* =========================================================
     AUTH STATE
  ========================================================= */

  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      console.log(
        "AUTH EVENT:",
        event
      );


      if (
        session &&
        session.user
      ) {

        currentUser =
          session.user;


        if (
          event === "PASSWORD_RECOVERY"
        ) {

          showAuthPage();

          showResetPassword();

          return;
        }


        if (
          $("appPage")
            .classList
            .contains("hidden")
        ) {

          await loadApp();

        }

      } else {

        showAuthPage();

      }

    }
  );


  /* =========================================================
     STARTUP
  ========================================================= */

  async function startApp() {

    try {

      const {
        data: {
          session
        }
      } =
        await supabaseClient.auth.getSession();


      if (
        session &&
        session.user
      ) {

        currentUser =
          session.user;

        await loadApp();

      } else {

        showAuthPage();

      }

    } catch (error) {

      console.error(
        "START ERROR:",
        error
      );

      showAuthPage();

    } finally {

      $("loading")
        .classList
        .add("hidden");

    }

  }


  /* =========================================================
     AUTO RESIZE MESSAGE BOX
  ========================================================= */

  $("messageInput")
    .addEventListener(
      "input",
      function() {

        this.style.height =
          "43px";

        this.style.height =
          Math.min(
            this.scrollHeight,
            110
          ) + "px";

      }
    );


  /* =========================================================
     PWA SERVICE WORKER
  ========================================================= */

  if (
    "serviceWorker" in navigator
  ) {

    window.addEventListener(
      "load",
      () => {

        navigator.serviceWorker
          .register(
            "./service-worker.js"
          )
          .then(
            registration => {

              console.log(
                "Dostaneh PWA فعال شد:",
                registration.scope
              );

            }
          )
          .catch(
            error => {

              console.error(
                "PWA ERROR:",
                error
              );

            }
          );

      }
    );

  }


  /* =========================================================
     START
  ========================================================= */

  startApp();

</script>

</body>
</html>
