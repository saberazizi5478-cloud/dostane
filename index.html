<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="اپ پیام‌رسان دوستانه">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png">

  <title>دوستانه</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .screen {
      min-height: 100vh;
    }

    /* AUTH */

    #authScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #eff6ff, #f8fafc);
    }

    .auth-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 15px 50px rgba(0,0,0,.08);
    }

    .logo {
      width: 76px;
      height: 76px;
      display: block;
      margin: 0 auto 15px;
      border-radius: 20px;
    }

    .auth-title {
      text-align: center;
      margin: 0 0 7px;
      font-size: 27px;
    }

    .auth-subtitle {
      text-align: center;
      color: #6b7280;
      margin: 0 0 25px;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      background: #f1f5f9;
      border-radius: 13px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 11px;
      border-radius: 10px;
      font-size: 15px;
      color: #64748b;
    }

    .tab.active {
      background: white;
      color: #2563eb;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      font-weight: bold;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 13px;
      margin-bottom: 7px;
      color: #374151;
    }

    .field input {
      width: 100%;
      border: 1px solid #dbe1ea;
      border-radius: 12px;
      padding: 13px 14px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    .field input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }

    .primary-btn {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 14px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-top: 5px;
    }

    .primary-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 11px;
      font-size: 13px;
      line-height: 1.8;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fef2f2;
      color: #b91c1c;
    }

    .message.success {
      background: #ecfdf5;
      color: #047857;
    }

    .message.info {
      background: #eff6ff;
      color: #1d4ed8;
    }

    /* APP */

    #appScreen {
      display: none;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 64px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
    }

    .topbar-title {
      font-size: 20px;
      font-weight: bold;
      color: #2563eb;
    }

    .topbar-actions {
      display: flex;
      gap: 7px;
    }

    .icon-btn {
      border: 0;
      background: #f1f5f9;
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 14px;
    }

    .app-content {
      max-width: 1000px;
      margin: auto;
      padding: 15px;
    }

    .welcome-card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 15px;
      border: 1px solid #e5e7eb;
    }

    .welcome-card h2 {
      margin: 0 0 5px;
      font-size: 20px;
    }

    .welcome-card p {
      margin: 0;
      color: #6b7280;
      font-size: 13px;
    }

    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 15px;
    }

    .panel {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      overflow: hidden;
    }

    .panel-header {
      padding: 15px;
      border-bottom: 1px solid #e5e7eb;
      font-weight: bold;
    }

    .users-list {
      max-height: 520px;
      overflow-y: auto;
    }

    .user-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 13px;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
    }

    .user-item:hover {
      background: #f8fafc;
    }

    .user-item.active {
      background: #eff6ff;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #dbeafe;
      color: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-info {
      min-width: 0;
    }

    .user-name {
      font-weight: bold;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-status {
      font-size: 11px;
      color: #64748b;
      margin-top: 3px;
    }

    /* CHAT */

    .chat-panel {
      display: flex;
      flex-direction: column;
      min-height: 520px;
    }

    .chat-header {
      padding: 13px 15px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-name {
      font-weight: bold;
    }

    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      min-height: 380px;
      max-height: 480px;
      background: #f8fafc;
    }

    .empty-chat {
      height: 100%;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      text-align: center;
      font-size: 14px;
    }

    .msg-row {
      display: flex;
      margin-bottom: 9px;
    }

    .msg-row.mine {
      justify-content: flex-start;
    }

    .msg-row.theirs {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 75%;
      padding: 9px 12px;
      border-radius: 15px;
      font-size: 14px;
      line-height: 1.7;
      word-break: break-word;
    }

    .mine .bubble {
      background: #2563eb;
      color: white;
      border-bottom-left-radius: 4px;
    }

    .theirs .bubble {
      background: white;
      border: 1px solid #e5e7eb;
      border-bottom-right-radius: 4px;
    }

    .msg-time {
      display: block;
      font-size: 9px;
      opacity: .65;
      margin-top: 3px;
    }

    .chat-input {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #e5e7eb;
      background: white;
    }

    .chat-input textarea {
      flex: 1;
      resize: none;
      border: 1px solid #dbe1ea;
      border-radius: 12px;
      padding: 10px;
      min-height: 43px;
      max-height: 110px;
      outline: none;
      font-size: 14px;
    }

    .send-btn {
      width: 48px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 19px;
    }

    /* ADMIN */

    #adminPanel {
      margin-top: 15px;
    }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 15px;
      background: #111827;
      color: white;
    }

    .admin-title {
      font-weight: bold;
    }

    .admin-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 12px;
    }

    .stat {
      background: #f8fafc;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .stat-number {
      font-size: 21px;
      font-weight: bold;
      color: #2563eb;
    }

    .stat-label {
      font-size: 11px;
      color: #64748b;
      margin-top: 3px;
    }

    .admin-users {
      padding: 0 12px 12px;
    }

    .admin-user {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .admin-user-main {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .admin-user-text {
      min-width: 0;
    }

    .admin-user-name {
      font-weight: bold;
      font-size: 14px;
    }

    .admin-user-meta {
      font-size: 10px;
      color: #64748b;
      margin-top: 3px;
    }

    .approval-btn {
      border: 0;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      white-space: nowrap;
    }

    .approval-on {
      background: #dcfce7;
      color: #166534;
    }

    .approval-off {
      background: #fee2e2;
      color: #991b1b;
    }

    .admin-loading {
      padding: 20px;
      text-align: center;
      color: #64748b;
    }

    /* MOBILE */

    @media (max-width: 720px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .users-list {
        max-height: 240px;
      }

      .chat-panel {
        min-height: 500px;
      }

      .admin-stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .admin-user {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <!-- AUTH SCREEN -->
  <section id="authScreen" class="screen">

    <div class="auth-box">

      <img class="logo" src="./icon-192.png" alt="دوستانه">

      <h1 class="auth-title">دوستانه</h1>
      <p class="auth-subtitle">پیام‌رسان دوستانه</p>

      <div class="tabs">
        <button id="loginTab" class="tab active" type="button">
          ورود
        </button>

        <button id="signupTab" class="tab" type="button">
          ثبت‌نام
        </button>
      </div>

      <!-- LOGIN -->
      <form id="loginForm">

        <div class="field">
          <label for="loginEmail">ایمیل</label>
          <input
            id="loginEmail"
            type="email"
            autocomplete="email"
            placeholder="ایمیل خود را وارد کنید"
            required
          >
        </div>

        <div class="field">
          <label for="loginPassword">رمز عبور</label>
          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            placeholder="رمز عبور"
            required
          >
        </div>

        <button id="loginBtn" class="primary-btn" type="submit">
          ورود
        </button>

      </form>

      <!-- SIGNUP -->
      <form id="signupForm" class="hidden">

        <div class="field">
          <label for="signupName">نام نمایشی</label>
          <input
            id="signupName"
            type="text"
            autocomplete="name"
            placeholder="مثلاً صابر"
            required
          >
        </div>

        <div class="field">
          <label for="signupEmail">ایمیل</label>
          <input
            id="signupEmail"
            type="email"
            autocomplete="email"
            placeholder="ایمیل"
            required
          >
        </div>

        <div class="field">
          <label for="signupPassword">رمز عبور</label>
          <input
            id="signupPassword"
            type="password"
            autocomplete="new-password"
            placeholder="حداقل ۶ کاراکتر"
            minlength="6"
            required
          >
        </div>

        <button id="signupBtn" class="primary-btn" type="submit">
          ثبت‌نام
        </button>

      </form>

      <div id="authMessage" class="message"></div>

    </div>
  </section>


  <!-- APP SCREEN -->
  <section id="appScreen">

    <header class="topbar">

      <div class="topbar-title">
        دوستانه
      </div>

      <div class="topbar-actions">

        <button
          id="refreshBtn"
          class="icon-btn"
          type="button"
        >
          🔄
        </button>

        <button
          id="logoutBtn"
          class="icon-btn"
          type="button"
        >
          خروج
        </button>

      </div>

    </header>


    <main class="app-content">

      <div class="welcome-card">

        <h2>
          سلام <span id="currentUserName">کاربر</span> 👋
        </h2>

        <p>
          به دوستانه خوش آمدی
        </p>

      </div>


      <div class="layout">

        <!-- USERS -->
        <div class="panel">

          <div class="panel-header">
            کاربران
          </div>

          <div id="usersList" class="users-list">
            <div class="admin-loading">
              در حال دریافت کاربران...
            </div>
          </div>

        </div>


        <!-- CHAT -->
        <div class="panel chat-panel">

          <div class="chat-header">

            <div id="chatAvatar" class="avatar">
              👤
            </div>

            <div id="chatName" class="chat-name">
              یک کاربر را انتخاب کن
            </div>

          </div>

          <div id="chatMessages" class="chat-messages">

            <div class="empty-chat">
              برای شروع گفتگو یک کاربر را انتخاب کن
            </div>

          </div>

          <div class="chat-input">

            <textarea
              id="messageInput"
              placeholder="پیامت را بنویس..."
              disabled
            ></textarea>

            <button
              id="sendBtn"
              class="send-btn"
              type="button"
              disabled
            >
              ➤
            </button>

          </div>

        </div>

      </div>


      <!-- ADMIN -->
      <section id="adminPanel" class="panel hidden">

        <div class="admin-header">

          <div class="admin-title">
            🛡 پنل مدیریت
          </div>

          <button
            id="adminRefreshBtn"
            class="icon-btn"
            type="button"
          >
            بروزرسانی
          </button>

        </div>

        <div id="adminStats" class="admin-stats"></div>

        <div id="adminUsers" class="admin-users">
          <div class="admin-loading">
            در حال دریافت اطلاعات...
          </div>
        </div>

      </section>

    </main>

  </section>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /* =========================================================
       SUPABASE
    ========================================================= */

    const SUPABASE_URL =
      "https://uobviepglysngosuomph.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ki1URRpDpSc-E5h5HQiq3w_2_-LHIHa";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================================
       STATE
    ========================================================= */

    let currentUser = null;
    let currentProfile = null;

    let selectedUser = null;

    let messageChannel = null;
    let approvalTimer = null;

    let isLoadingApp = false;
    let isLoggingIn = false;


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const authScreen =
      document.getElementById("authScreen");

    const appScreen =
      document.getElementById("appScreen");

    const loginTab =
      document.getElementById("loginTab");

    const signupTab =
      document.getElementById("signupTab");

    const loginForm =
      document.getElementById("loginForm");

    const signupForm =
      document.getElementById("signupForm");

    const loginBtn =
      document.getElementById("loginBtn");

    const signupBtn =
      document.getElementById("signupBtn");

    const authMessage =
      document.getElementById("authMessage");

    const currentUserName =
      document.getElementById("currentUserName");

    const usersList =
      document.getElementById("usersList");

    const chatMessages =
      document.getElementById("chatMessages");

    const chatName =
      document.getElementById("chatName");

    const chatAvatar =
      document.getElementById("chatAvatar");

    const messageInput =
      document.getElementById("messageInput");

    const sendBtn =
      document.getElementById("sendBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const refreshBtn =
      document.getElementById("refreshBtn");

    const adminPanel =
      document.getElementById("adminPanel");

    const adminStats =
      document.getElementById("adminStats");

    const adminUsers =
      document.getElementById("adminUsers");

    const adminRefreshBtn =
      document.getElementById("adminRefreshBtn");


    /* =========================================================
       HELPERS
    ========================================================= */

    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function showAuthMessage(
      text,
      type = "info"
    ) {

      authMessage.textContent = text;

      authMessage.className =
        "message show " + type;
    }


    function clearAuthMessage() {

      authMessage.textContent = "";

      authMessage.className =
        "message";
    }


    function setLoginLoading(loading) {

      loginBtn.disabled = loading;

      loginBtn.textContent =
        loading ? "در حال ورود..." : "ورود";
    }


    function setSignupLoading(loading) {

      signupBtn.disabled = loading;

      signupBtn.textContent =
        loading ? "در حال ثبت‌نام..." : "ثبت‌نام";
    }


    function getAvatarHtml(user) {

      if (user?.avatar_url) {

        return `
          <img
            src="${escapeHtml(user.avatar_url)}"
            alt=""
          >
        `;
      }

      const name =
        user?.display_name || "کاربر";

      return escapeHtml(
        name.trim().charAt(0) || "👤"
      );
    }


    function formatDate(date) {

      try {

        return new Date(date).toLocaleString(
          "fa-IR",
          {
            dateStyle: "short",
            timeStyle: "short"
          }
        );

      } catch {

        return "";
      }
    }


    /* =========================================================
       AUTH TABS
    ========================================================= */

    loginTab.addEventListener(
      "click",
      () => {

        loginTab.classList.add("active");
        signupTab.classList.remove("active");

        loginForm.classList.remove("hidden");
        signupForm.classList.add("hidden");

        clearAuthMessage();
      }
    );


    signupTab.addEventListener(
      "click",
      () => {

        signupTab.classList.add("active");
        loginTab.classList.remove("active");

        signupForm.classList.remove("hidden");
        loginForm.classList.add("hidden");

        clearAuthMessage();
      }
    );


    /* =========================================================
       LOGIN
    ========================================================= */

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        if (isLoggingIn) return;

        isLoggingIn = true;

        setLoginLoading(true);
        clearAuthMessage();

        const email =
          document
            .getElementById("loginEmail")
            .value
            .trim();

        const password =
          document
            .getElementById("loginPassword")
            .value;


        try {

          const {
            data,
            error
          } =
            await supabaseClient.auth.signInWithPassword({
              email,
              password
            });


          if (error) {
            throw error;
          }


          if (!data?.user) {
            throw new Error(
              "ورود انجام نشد. کاربر دریافت نشد."
            );
          }


          /*
            مهم:

            اینجا مستقیم loadApp اجرا می‌شود.
            دیگر منتظر SIGNED_IN نمی‌مانیم.
          */

          await loadApp(data.user);


        } catch (error) {

          console.error(
            "LOGIN ERROR:",
            error
          );

          showAuthMessage(
            getAuthErrorMessage(error),
            "error"
          );

          try {
            await supabaseClient.auth.signOut();
          } catch {}

        } finally {

          isLoggingIn = false;

          setLoginLoading(false);
        }

      }
    );


    /* =========================================================
       SIGNUP
    ========================================================= */

    signupForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        setSignupLoading(true);
        clearAuthMessage();

        const displayName =
          document
            .getElementById("signupName")
            .value
            .trim();

        const email =
          document
            .getElementById("signupEmail")
            .value
            .trim();

        const password =
          document
            .getElementById("signupPassword")
            .value;


        try {

          if (!displayName) {
            throw new Error(
              "نام نمایشی را وارد کن."
            );
          }

          if (password.length < 6) {
            throw new Error(
              "رمز عبور باید حداقل ۶ کاراکتر باشد."
            );
          }


          const {
            data,
            error
          } =
            await supabaseClient.auth.signUp({

              email,
              password,

              options: {
                data: {
                  display_name: displayName
                }
              }

            });


          if (error) {
            throw error;
          }


          /*
            Confirm Email روشن است.

            بنابراین معمولاً session نداریم.
            Trigger دیتابیس پروفایل را خودش می‌سازد.
          */

          if (data?.session) {

            showAuthMessage(
              "ثبت‌نام انجام شد. حساب شما در انتظار تأیید مدیر است.",
              "success"
            );

          } else {

            showAuthMessage(
              "ثبت‌نام انجام شد. ایمیل را تأیید کن؛ سپس مدیر باید اجازه ورود را فعال کند.",
              "success"
            );
          }


          signupForm.reset();


        } catch (error) {

          console.error(
            "SIGNUP ERROR:",
            error
          );

          showAuthMessage(
            getAuthErrorMessage(error),
            "error"
          );

        } finally {

          setSignupLoading(false);
        }

      }
    );


    /* =========================================================
       AUTH ERROR
    ========================================================= */

    function getAuthErrorMessage(error) {

      const message =
        String(error?.message || error || "");

      const lower =
        message.toLowerCase();


      if (
        lower.includes("invalid login credentials")
      ) {
        return "ایمیل یا رمز عبور اشتباه است.";
      }


      if (
        lower.includes("email not confirmed")
      ) {
        return "ایمیل این حساب هنوز تأیید نشده است.";
      }


      if (
        lower.includes("user already registered")
      ) {
        return "این ایمیل قبلاً ثبت‌نام کرده است.";
      }


      if (
        lower.includes("password")
      ) {
        return message;
      }


      return message ||
        "خطایی هنگام ورود رخ داد.";
    }


    /* =========================================================
       LOAD APP
    ========================================================= */

    async function loadApp(user) {

      if (isLoadingApp) {
        return;
      }

      isLoadingApp = true;


      try {

        console.log(
          "LOAD APP FOR:",
          user.id
        );


        const {
          data: profile,
          error: profileError
        } =
          await supabaseClient
            .from("profiles")
            .select(
              "id,display_name,avatar_url,created_at,updated_at,approved"
            )
            .eq("id", user.id)
            .maybeSingle();


        if (profileError) {

          console.error(
            "PROFILE ERROR:",
            profileError
          );

          throw new Error(
            "دریافت اطلاعات حساب انجام نشد: " +
            profileError.message
          );
        }


        if (!profile) {

          throw new Error(
            "پروفایل این حساب هنوز ساخته نشده است."
          );
        }


        console.log(
          "PROFILE:",
          profile
        );


        /*
          کنترل اصلی تأیید مدیر
        */

        if (profile.approved !== true) {

          await supabaseClient.auth.signOut();

          showAuthMessage(
            "این حساب هنوز توسط مدیر تأیید نشده است.",
            "info"
          );

          showAuth();

          return;
        }


        currentUser = user;
        currentProfile = profile;


        currentUserName.textContent =
          profile.display_name || "کاربر";


        showApp();


        /*
          این‌ها نباید ورود را متوقف کنند.
        */

        await loadUsers();

        await detectAdmin();

        startApprovalWatcher();

        setupRealtime();


      } catch (error) {

        console.error(
          "LOAD APP ERROR:",
          error
        );

        await supabaseClient.auth.signOut();

        showAuth();

        showAuthMessage(
          error?.message ||
          "خطایی هنگام ورود به برنامه رخ داد.",
          "error"
        );

      } finally {

        isLoadingApp = false;
      }

    }


    /* =========================================================
       SHOW / HIDE
    ========================================================= */

    function showApp() {

      authScreen.style.display = "none";
      appScreen.style.display = "block";
    }


    function showAuth() {

      authScreen.style.display = "flex";
      appScreen.style.display = "none";
    }


    /* =========================================================
       LOAD USERS
    ========================================================= */

    async function loadUsers() {

      usersList.innerHTML =
        `<div class="admin-loading">
          در حال دریافت کاربران...
        </div>`;


      const {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,display_name,avatar_url,created_at,updated_at,approved"
          )
          .eq("approved", true)
          .neq("id", currentUser.id)
          .order(
            "display_name",
            { ascending: true }
          );


      if (error) {

        console.error(
          "USERS ERROR:",
          error
        );

        usersList.innerHTML =
          `<div class="admin-loading">
            خطا در دریافت کاربران
          </div>`;

        return;
      }


      if (!data || data.length === 0) {

        usersList.innerHTML =
          `<div class="admin-loading">
            هنوز کاربر دیگری وجود ندارد.
          </div>`;

        return;
      }


      usersList.innerHTML =
        data.map(user => `

          <div
            class="user-item ${
              selectedUser?.id === user.id
                ? "active"
                : ""
            }"
            data-user-id="${escapeHtml(user.id)}"
          >

            <div class="avatar">
              ${getAvatarHtml(user)}
            </div>

            <div class="user-info">

              <div class="user-name">
                ${escapeHtml(
                  user.display_name || "کاربر"
                )}
              </div>

              <div class="user-status">
                آنلاین در دوستانه
              </div>

            </div>

          </div>

        `).join("");


      usersList
        .querySelectorAll(".user-item")
        .forEach(item => {

          item.addEventListener(
            "click",
            () => {

              const id =
                item.dataset.userId;

              const user =
                data.find(
                  x => x.id === id
                );

              if (user) {
                selectUser(user);
              }

            }
          );

        });

    }


    /* =========================================================
       SELECT USER
    ========================================================= */

    async function selectUser(user) {

      selectedUser = user;


      chatName.textContent =
        user.display_name || "کاربر";


      chatAvatar.innerHTML =
        getAvatarHtml(user);


      messageInput.disabled = false;
      sendBtn.disabled = false;


      await loadMessages();

      await loadUsers();
    }


    /* =========================================================
       LOAD MESSAGES
    ========================================================= */

    async function loadMessages() {

      if (!selectedUser || !currentUser) {
        return;
      }


      chatMessages.innerHTML =
        `<div class="admin-loading">
          در حال دریافت پیام‌ها...
        </div>`;


      const {
        data,
        error
      } =
        await supabaseClient
          .from("messages")
          .select(
            "id,sender_id,receiver_id,content,created_at"
          )
          .or(
            `and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedUser.id}),and(sender_id.eq.${selectedUser.id},receiver_id.eq.${currentUser.id})`
          )
          .order(
            "created_at",
            { ascending: true }
          );


      if (error) {

        console.error(
          "MESSAGES ERROR:",
          error
        );

        chatMessages.innerHTML =
          `<div class="empty-chat">
            خطا در دریافت پیام‌ها
          </div>`;

        return;
      }


      renderMessages(data || []);
    }


    /* =========================================================
       RENDER MESSAGES
    ========================================================= */

    function renderMessages(messages) {

      if (!messages.length) {

        chatMessages.innerHTML =
          `<div class="empty-chat">
            هنوز پیامی وجود ندارد.<br>
            اولین پیام را تو بفرست 👋
          </div>`;

        return;
      }


      chatMessages.innerHTML =
        messages.map(message => {

          const mine =
            message.sender_id === currentUser.id;


          return `

            <div class="msg-row ${
              mine ? "mine" : "theirs"
            }">

              <div class="bubble">

                ${escapeHtml(
                  message.content
                )}

                <span class="msg-time">
                  ${formatDate(
                    message.created_at
                  )}
                </span>

              </div>

            </div>

          `;

        }).join("");


      chatMessages.scrollTop =
        chatMessages.scrollHeight;
    }


    /* =========================================================
       SEND MESSAGE
    ========================================================= */

    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    messageInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();
        }

      }
    );


    async function sendMessage() {

      if (
        !currentUser ||
        !selectedUser
      ) {
        return;
      }


      const content =
        messageInput.value.trim();


      if (!content) {
        return;
      }


      sendBtn.disabled = true;


      try {

        const {
          error
        } =
          await supabaseClient
            .from("messages")
            .insert({
              sender_id: currentUser.id,
              receiver_id: selectedUser.id,
              content
            });


        if (error) {
          throw error;
        }


        messageInput.value = "";

        await loadMessages();


      } catch (error) {

        console.error(
          "SEND ERROR:",
          error
        );

        alert(
          "ارسال پیام انجام نشد: " +
          (error?.message || "")
        );

      } finally {

        sendBtn.disabled = false;

        messageInput.focus();
      }

    }


    /* =========================================================
       REALTIME
    ========================================================= */

    function setupRealtime() {

      if (messageChannel) {

        supabaseClient.removeChannel(
          messageChannel
        );

        messageChannel = null;
      }


      messageChannel =
        supabaseClient
          .channel(
            "messages-realtime-" +
            currentUser.id
          )
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "messages"
            },
            payload => {

              const message =
                payload.new;


              if (
                !selectedUser ||
                !currentUser
              ) {
                return;
              }


              const belongs =
                (
                  message.sender_id === currentUser.id &&
                  message.receiver_id === selectedUser.id
                ) ||
                (
                  message.sender_id === selectedUser.id &&
                  message.receiver_id === currentUser.id
                );


              if (belongs) {
                loadMessages();
              }

            }
          )
          .subscribe();

    }


    /* =========================================================
       ADMIN DETECTION
    ========================================================= */

    async function detectAdmin() {

      adminPanel.classList.add("hidden");


      try {

        const {
          data,
          error
        } =
          await supabaseClient.functions.invoke(
            "admin-panel",
            {
              body: {
                action: "list"
              }
            }
          );


        if (error) {

          console.log(
            "ADMIN CHECK:",
            error
          );

          return;
        }


        if (
          data &&
          Array.isArray(data.users)
        ) {

          adminPanel.classList.remove(
            "hidden"
          );

          renderAdminData(data);
        }


      } catch (error) {

        console.log(
          "ADMIN DETECTION ERROR:",
          error
        );
      }

    }


    /* =========================================================
       LOAD ADMIN DATA
    ========================================================= */

    async function loadAdminData() {

      if (!currentUser) {
        return;
      }


      adminUsers.innerHTML =
        `<div class="admin-loading">
          در حال دریافت اطلاعات...
        </div>`;


      try {

        const {
          data,
          error
        } =
          await supabaseClient.functions.invoke(
            "admin-panel",
            {
              body: {
                action: "list"
              }
            }
          );


        if (error) {
          throw error;
        }


        if (!data) {
          throw new Error(
            "پاسخی از پنل مدیریت دریافت نشد."
          );
        }


        renderAdminData(data);


      } catch (error) {

        console.error(
          "ADMIN LOAD ERROR:",
          error
        );

        adminUsers.innerHTML =
          `<div class="admin-loading">
            خطا در دریافت پنل مدیریت
          </div>`;
      }

    }


    /* =========================================================
       RENDER ADMIN
    ========================================================= */

    function renderAdminData(data) {

      const stats =
        data.stats || {};


      adminStats.innerHTML = `

        <div class="stat">

          <div class="stat-number">
            ${stats.total_users || 0}
          </div>

          <div class="stat-label">
            کل کاربران
          </div>

        </div>


        <div class="stat">

          <div class="stat-number">
            ${stats.approved_users || 0}
          </div>

          <div class="stat-label">
            تأیید شده
          </div>

        </div>


        <div class="stat">

          <div class="stat-number">
            ${stats.pending_users || 0}
          </div>

          <div class="stat-label">
            در انتظار
          </div>

        </div>


        <div class="stat">

          <div class="stat-number">
            ${stats.total_messages || 0}
          </div>

          <div class="stat-label">
            پیام‌ها
          </div>

        </div>

      `;


      const users =
        data.users || [];


      if (!users.length) {

        adminUsers.innerHTML =
          `<div class="admin-loading">
            کاربری وجود ندارد.
          </div>`;

        return;
      }


      adminUsers.innerHTML =
        users.map(user => {

          const isCurrent =
            user.id === currentUser.id;


          return `

            <div class="admin-user">

              <div class="admin-user-main">

                <div class="avatar">
                  ${getAvatarHtml(user)}
                </div>

                <div class="admin-user-text">

                  <div class="admin-user-name">
                    ${escapeHtml(
                      user.display_name || "کاربر"
                    )}
                  </div>

                  <div class="admin-user-meta">
                    ${user.message_count || 0}
                    پیام
                    •
                    ${formatDate(
                      user.created_at
                    )}
                  </div>

                </div>

              </div>


              ${
                isCurrent

                ? `
                  <button
                    class="approval-btn approval-on"
                    disabled
                  >
                    مدیر
                  </button>
                `

                : `
                  <button
                    class="approval-btn ${
                      user.approved
                        ? "approval-on"
                        : "approval-off"
                    }"
                    data-approval-id="${escapeHtml(user.id)}"
                    data-approved="${user.approved}"
                  >
                    ${
                      user.approved
                        ? "✓ اجازه ورود"
                        : "✕ بدون اجازه"
                    }
                  </button>
                `
              }

            </div>

          `;

        }).join("");


      adminUsers
        .querySelectorAll(
          "[data-approval-id]"
        )
        .forEach(button => {

          button.addEventListener(
            "click",
            async () => {

              const userId =
                button.dataset.approvalId;

              const approved =
                button.dataset.approved !== "true";


              await setApproval(
                userId,
                approved
              );

            }
          );

        });

    }


    /* =========================================================
       SET APPROVAL
    ========================================================= */

    async function setApproval(
      targetUserId,
      approved
    ) {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.functions.invoke(
            "admin-panel",
            {
              body: {
                action: "set_approval",
                target_user_id:
                  targetUserId,
                approved
              }
            }
          );


        if (error) {
          throw error;
        }


        if (data?.error) {
          throw new Error(data.error);
        }


        await loadAdminData();

        await loadUsers();


      } catch (error) {

        console.error(
          "APPROVAL ERROR:",
          error
        );

        alert(
          error?.message ||
          "تغییر وضعیت کاربر انجام نشد."
        );
      }

    }


    /* =========================================================
       APPROVAL WATCHER
    ========================================================= */

    function startApprovalWatcher() {

      stopApprovalWatcher();


      approvalTimer =
        setInterval(
          checkMyApproval,
          30000
        );
    }


    function stopApprovalWatcher() {

      if (approvalTimer) {

        clearInterval(
          approvalTimer
        );

        approvalTimer = null;
      }

    }


    async function checkMyApproval() {

      if (!currentUser) {
        return;
      }


      const {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select("approved")
          .eq("id", currentUser.id)
          .maybeSingle();


      if (error) {
        return;
      }


      if (!data || data.approved !== true) {

        await logout();
      }

    }


    /* =========================================================
       LOGOUT
    ========================================================= */

    logoutBtn.addEventListener(
      "click",
      logout
    );


    async function logout() {

      stopApprovalWatcher();


      if (messageChannel) {

        try {

          await supabaseClient
            .removeChannel(
              messageChannel
            );

        } catch {}

        messageChannel = null;
      }


      currentUser = null;
      currentProfile = null;
      selectedUser = null;


      messageInput.disabled = true;
      sendBtn.disabled = true;


      chatName.textContent =
        "یک کاربر را انتخاب کن";

      chatAvatar.innerHTML =
        "👤";

      chatMessages.innerHTML =
        `<div class="empty-chat">
          برای شروع گفتگو یک کاربر را انتخاب کن
        </div>`;


      adminPanel.classList.add(
        "hidden"
      );


      try {
        await supabaseClient.auth.signOut();
      } catch {}


      showAuth();

      loginForm.reset();

      clearAuthMessage();

    }


    /* =========================================================
       REFRESH
    ========================================================= */

    refreshBtn.addEventListener(
      "click",
      async () => {

        if (!currentUser) {
          return;
        }

        await loadUsers();

        if (selectedUser) {
          await loadMessages();
        }

        if (
          !adminPanel.classList.contains(
            "hidden"
          )
        ) {
          await loadAdminData();
        }

      }
    );


    adminRefreshBtn.addEventListener(
      "click",
      loadAdminData
    );


    /* =========================================================
       AUTH STATE CHANGE
    ========================================================= */

    /*
      خیلی مهم:

      اینجا دیگر برای SIGNED_IN، loadApp اجرا نمی‌کنیم.

      چون در loginForm خودمان مستقیم loadApp
      را اجرا کرده‌ایم.

      این کار جلوی اجرای دوباره و گیر کردن
      روی "در حال ورود..." را می‌گیرد.
    */

    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {

        console.log(
          "AUTH EVENT:",
          event
        );


        if (event === "SIGNED_OUT") {

          stopApprovalWatcher();

          currentUser = null;
          currentProfile = null;

          showAuth();
        }

      }
    );


    /* =========================================================
       INITIALIZE
    ========================================================= */

    async function init() {

      try {

        console.log(
          "INITIALIZING..."
        );


        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();


        if (error) {

          console.error(
            "SESSION ERROR:",
            error
          );

          showAuth();

          return;
        }


        const session =
          data?.session;


        if (session?.user) {

          console.log(
            "EXISTING SESSION:",
            session.user.id
          );


          await loadApp(
            session.user
          );

        } else {

          showAuth();

        }


      } catch (error) {

        console.error(
          "INIT ERROR:",
          error
        );

        showAuth();

      }

    }


    /* =========================================================
       SERVICE WORKER
    ========================================================= */

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register(
              "./service-worker.js"
            )
            .then(
              registration => {

                console.log(
                  "Service Worker registered:",
                  registration.scope
                );

              }
            )
            .catch(
              error => {

                console.log(
                  "Service Worker error:",
                  error
                );

              }
            );

        }
      );

    }


    /* =========================================================
       START
    ========================================================= */

    init();

  </script>

</body>
</html>
