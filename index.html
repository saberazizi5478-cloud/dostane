<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دوستانه</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Tahoma, Arial, sans-serif;
}

body {
  background: #f7f8fc;
  color: #222;
}

.app {
  max-width: 600px;
  min-height: 100vh;
  margin: auto;
  position: relative;
}

/* صفحه اصلی */

.home {
  padding: 22px 18px 100px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

.logo {
  font-size: 30px;
  font-weight: 800;
}

.subtitle {
  color: #888;
  font-size: 14px;
  margin-top: 5px;
}

.profile {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: none;
  background: #e9e7ff;
  color: #5b50d6;
  font-weight: bold;
}

.search {
  background: white;
  border-radius: 17px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 25px;
}

.search span {
  font-size: 23px;
  color: #777;
}

.search input {
  border: none;
  outline: none;
  width: 100%;
  font-size: 15px;
  text-align: right;
}

.section {
  display: flex;
  justify-content: space-between;
  margin-bottom: 13px;
}

.section h2 {
  font-size: 21px;
}

.count {
  color: #999;
  font-size: 13px;
}

.chat {
  background: white;
  border-radius: 18px;
  padding: 14px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  cursor: pointer;
}

.avatar {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: #e9e7ff;
  color: #5b50d6;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 21px;
  font-weight: bold;
  margin-left: 13px;
}

.chat-content {
  flex: 1;
}

.chat-top {
  display: flex;
  justify-content: space-between;
  margin-bottom: 7px;
}

.name {
  font-weight: bold;
  font-size: 16px;
}

.time {
  color: #999;
  font-size: 12px;
}

.message {
  color: #888;
  font-size: 14px;
}

/* دکمه گفتگوی جدید */

.new-chat {
  position: fixed;
  bottom: 22px;
  right: 50%;
  transform: translateX(50%);
  max-width: 560px;
  width: calc(100% - 36px);
  height: 56px;
  border: none;
  border-radius: 30px;
  background: #5b50d6;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

/* صفحه چت */

.chat-page {
  display: none;
  min-height: 100vh;
  flex-direction: column;
  background: #f7f8fc;
}

.chat-header {
  height: 70px;
  background: white;
  display: flex;
  align-items: center;
  padding: 10px 16px;
  border-bottom: 1px solid #eee;
}

.back {
  border: none;
  background: transparent;
  font-size: 28px;
  margin-left: 12px;
  cursor: pointer;
}

.chat-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #e9e7ff;
  color: #5b50d6;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
  margin-left: 10px;
}

.chat-user {
  font-weight: bold;
  font-size: 16px;
}

.online {
  color: #32a852;
  font-size: 11px;
  margin-top: 3px;
}

.messages {
  flex: 1;
  padding: 18px;
  overflow-y: auto;
}

.message-row {
  display: flex;
  margin-bottom: 12px;
}

.message-row.me {
  justify-content: flex-start;
}

.message-row.other {
  justify-content: flex-end;
}

.bubble {
  max-width: 75%;
  padding: 11px 14px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.7;
}

.me .bubble {
  background: #5b50d6;
  color: white;
  border-bottom-left-radius: 5px;
}

.other .bubble {
  background: white;
  color: #333;
  border-bottom-right-radius: 5px;
}

.message-time {
  display: block;
  font-size: 9px;
  opacity: 0.65;
  margin-top: 3px;
}

/* ورودی پیام */

.message-input-area {
  background: white;
  padding: 10px;
  display: flex;
  gap: 8px;
  border-top: 1px solid #eee;
}

.message-input {
  flex: 1;
  border: none;
  outline: none;
  background: #f3f4f8;
  border-radius: 25px;
  padding: 12px 16px;
  font-size: 14px;
  text-align: right;
}

.send {
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 50%;
  background: #5b50d6;
  color: white;
  font-size: 20px;
}

/* موبایل */

@media(max-width:600px) {

  .app {
    width: 100%;
  }

  .bubble {
    max-width: 82%;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- صفحه اصلی -->

  <div class="home" id="home">

    <div class="header">

      <div>
        <div class="logo">دوستانه</div>
        <div class="subtitle">گفت‌وگو با دوستانت</div>
      </div>

      <button class="profile">من</button>

    </div>

    <div class="search">

      <span>⌕</span>

      <input
        id="search"
        type="text"
        placeholder="جستجوی گفتگو..."
      >

    </div>

    <div class="section">

      <h2>گفتگوها</h2>

      <span class="count">3 گفتگو</span>

    </div>

    <div id="chatList">

      <div class="chat" onclick="openChat('علی','ع')">

        <div class="avatar">ع</div>

        <div class="chat-content">

          <div class="chat-top">

            <span class="name">علی</span>

            <span class="time">21:30</span>

          </div>

          <div class="message">
            سلام! خوبی؟
          </div>

        </div>

      </div>


      <div class="chat" onclick="openChat('سارا','س')">

        <div class="avatar">س</div>

        <div class="chat-content">

          <div class="chat-top">

            <span class="name">سارا</span>

            <span class="time">20:15</span>

          </div>

          <div class="message">
            بعداً باهات صحبت می‌کنم 😊
          </div>

        </div>

      </div>


      <div class="chat" onclick="openChat('محمد','م')">

        <div class="avatar">م</div>

        <div class="chat-content">

          <div class="chat-top">

            <span class="name">محمد</span>

            <span class="time">18:42</span>

          </div>

          <div class="message">
            عالیه، ممنون!
          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- صفحه چت -->

  <div class="chat-page" id="chatPage">

    <div class="chat-header">

      <button class="back" onclick="goHome()">
        ‹
      </button>

      <div class="chat-avatar" id="chatAvatar">
        ع
      </div>

      <div>

        <div class="chat-user" id="chatUser">
          علی
        </div>

        <div class="online">
          آنلاین
        </div>

      </div>

    </div>


    <div class="messages" id="messages">

      <div class="message-row other">

        <div class="bubble">

          سلام! خوبی؟

          <span class="message-time">
            21:30
          </span>

        </div>

      </div>


      <div class="message-row me">

        <div class="bubble">

          سلام، مرسی! تو خوبی؟ 😊

          <span class="message-time">
            21:31
          </span>

        </div>

      </div>


      <div class="message-row other">

        <div class="bubble">

          آره، منم خوبم!

          <span class="message-time">
            21:32
          </span>

        </div>

      </div>

    </div>


    <div class="message-input-area">

      <input
        id="messageInput"
        class="message-input"
        type="text"
        placeholder="پیامت رو بنویس..."
        onkeydown="handleEnter(event)"
      >

      <button
        class="send"
        onclick="sendMessage()"
      >
        ➤
      </button>

    </div>

  </div>

</div>


<script>

let currentUser = "";


/* باز کردن چت */

function openChat(name, avatar) {

  currentUser = name;

  document.getElementById("home").style.display = "none";

  document.getElementById("chatPage").style.display = "flex";

  document.getElementById("chatUser").textContent = name;

  document.getElementById("chatAvatar").textContent = avatar;

}


/* برگشت */

function goHome() {

  document.getElementById("chatPage").style.display = "none";

  document.getElementById("home").style.display = "block";

}


/* ارسال پیام */

function sendMessage() {

  const input =
    document.getElementById("messageInput");

  const text = input.value.trim();

  if (text === "") {
    return;
  }

  const messages =
    document.getElementById("messages");

  const row =
    document.createElement("div");

  row.className = "message-row me";

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  const time =
    document.createElement("span");

  time.className = "message-time";

  const now = new Date();

  time.textContent =
    now.getHours().toString().padStart(2,"0")
    + ":"
    +
    now.getMinutes().toString().padStart(2,"0");

  bubble.appendChild(time);

  row.appendChild(bubble);

  messages.appendChild(row);

  input.value = "";

  messages.scrollTop =
    messages.scrollHeight;

}


/* ارسال با Enter */

function handleEnter(event) {

  if (event.key === "Enter") {

    sendMessage();

  }

}


/* جستجو */

document
  .getElementById("search")
  .addEventListener("input", function() {

    const search =
      this.value.toLowerCase();

    const chats =
      document.querySelectorAll(".chat");

    chats.forEach(function(chat) {

      const name =
        chat
          .querySelector(".name")
          .textContent
          .toLowerCase();

      chat.style.display =
        name.includes(search)
        ? "flex"
        : "none";

    });

  });

</script>

</body>
</html>
